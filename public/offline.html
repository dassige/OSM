<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpReady — Offline</title>
    <link rel="icon" type="image/x-icon" href="/resources/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#17A2B8">
    <style>
        :root {
            --primary: #17A2B8;
            --primary-hover: #148a9e;
            --bg: #f0f2f5;
            --bg-card: #fff;
            --text-main: #333;
            --text-muted: #555;
            --text-hint: #888;
            --icon-bg: #e8f7f9;
            --shadow: rgba(0,0,0,0.1);
        }

        body.dark-mode {
            --bg: #121212;
            --bg-card: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #aaa;
            --text-hint: #666;
            --icon-bg: #2a3a3e;
            --shadow: rgba(0,0,0,0.5);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 24px;
            text-align: center;
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 4px 24px var(--shadow);
        }

        .icon {
            width: 80px;
            height: 80px;
            background: var(--icon-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .icon svg { color: var(--primary); }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
        }

        p {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .hint {
            font-size: 0.875rem;
            color: var(--text-hint);
            margin-top: 16px;
        }

        .retry-btn {
            display: inline-block;
            margin-top: 28px;
            padding: 12px 32px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }

        .retry-btn:hover { background: var(--primary-hover); }
    </style>
    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"/>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
                <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                <line x1="12" y1="20" x2="12.01" y2="20"/>
            </svg>
        </div>
        <h1>You're offline</h1>
        <p>OpReady can't connect right now. Check your internet connection and try again.</p>
        <p class="hint">Pages you've recently visited may still be available from your device's cache.</p>
        <button class="retry-btn" onclick="window.location.reload()" title="Reload the page and retry connecting">Try again</button>
    </div>
    <script>
        window.addEventListener('online', () => window.location.reload());
    </script>
</body>
</html>
