<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="resources/favicon.ico">
    <title id="pageTitle">Live Forms Management - FENZ OSM</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="demoBanner" class="demo-banner">
        DEMO VERSION <span style="font-weight:normal;">(<a href="demo/demo_osm_dasboard.html" target="_blank"
                style="color:inherit; text-decoration:underline;">View Source HTML</a>)</span>
    </div>

    <a href="/" class="back-btn" title="Back to Dashboard">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>

    <div class="container">
        <h1 id="pageHeader" class="text-center" style="margin-bottom: 30px;">Live Forms Management</h1>

        <div class="filter-bar">
            <div class="filter-group" style="flex: 0 0 auto; min-width: 160px;">
                <label>View Mode</label>
                <div class="sliding-badge-container">
                    <input type="checkbox" id="archiveToggle" onchange="applyFilters(1)" style="display:none;">
                    <label for="archiveToggle" class="sliding-badge">
                        <span class="badge-label active-label">Active</span>
                        <span class="badge-label archived-label">Archived</span>
                        <div class="badge-slider"></div>
                    </label>
                </div>
            </div>
            <div class="filter-group">
                <label>Status</label>
                <select id="filterStatus" class="filter-select">
                    <option value="">All Statuses</option>
                    <option value="sent">Sent</option>
                    <option value="submitted">Submitted</option>
                    <option value="accepted">Accepted</option>
                    <option value="rejected">Rejected</option>
                    <option value="disabled">Disabled</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Member</label>
                <select id="filterMember" class="filter-select">
                    <option value="">All Members</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Skill</label>
                <select id="filterSkill" class="filter-select">
                    <option value="">All Skills</option>
                </select>
            </div>

            <div class="filter-group" style="flex: 0 1 100px; min-width:100px;">
                <label>Tries</label>
                <input type="number" id="filterTries" class="filter-select" min="1" placeholder="Any">
            </div>

            <div class="filter-group filter-group-date">
                <label>Sent Date</label>
                <div class="date-range-container">
                    <input type="date" id="filterSentStart" class="filter-date">
                    <input type="date" id="filterSentEnd" class="filter-date">
                </div>
            </div>

            <div class="filter-group filter-group-date">
                <label>Submitted Date</label>
                <div class="date-range-container">
                    <input type="date" id="filterSubStart" class="filter-date">
                    <input type="date" id="filterSubEnd" class="filter-date">
                </div>
            </div>

            <div class="filter-actions">
                <button onclick="applyFilters(1)" class="btn-primary" style="height: 38px;">Apply</button>
                <button onclick="resetFilters()" class="btn-secondary" style="height: 38px;">Reset</button>
            </div>
        </div>

        <div class="tools-bar">
            <button onclick="loadData()" class="btn-icon" title="Refresh Table"
                style="margin-right: 15px; color: var(--primary);">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6"></path>
                    <path d="M1 20v-6h6"></path>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
            </button>
            <div class="page-limit-selector">
                <label>Rows per page:</label>
                <select id="rowsPerPage" onchange="changeLimit(this.value)"
                    style="padding:4px; border-radius:4px; border:1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-main);">
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="500">500</option>
                </select>
            </div>
            <div style="display:flex; gap:10px;">
                <button onclick="exportJson()" class="btn-sm btn-success" title="Download filtered records as JSON">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Download JSON
                </button>
                <button onclick="purgeFiltered()" class="btn-sm btn-danger"
                    title="Delete ALL records matching current filters">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    Purge Filtered
                </button>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="liveFormsTable">
                <thead>
                    <tr>
                        <th class="sortable" onclick="handleSort('member_name')">
                            <div class="th-content">Member <span id="icon-member_name" class="sort-icon"></span></div>
                        </th>
                        <th class="sortable" onclick="handleSort('skill_name')">
                            <div class="th-content">Skill <span id="icon-skill_name" class="sort-icon"></span></div>
                        </th>
                        <th class="sortable text-center" onclick="handleSort('tries')" style="width: 70px;">
                            <div class="th-content" style="justify-content:center;">Tries <span id="icon-tries" class="sort-icon"></span></div>
                        </th>
                        <th class="text-center" style="width: 100px;">Score</th>
                        <th style="width: 220px; vertical-align: middle;">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <span>Dates</span>
                                <div style="font-size: 0.75em; line-height: 1.2; text-align: right; opacity: 0.8; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 8px;">
                                    <b>S</b>ent<br>
                                    <b>U</b>ploaded<br>
                                    <b>R</b>eviewed
                                </div>
                            </div>
                        </th>
                        <th class="sortable text-center" onclick="handleSort('form_status')">
                            <div class="th-content" style="justify-content:center;">Status <span id="icon-form_status" class="sort-icon"></span></div>
                        </th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="7" class="text-center">Loading...</td>
                    </tr>
                </tbody>
            </table>

            <div id="paginationControls" class="pagination-container" style="display:none;">
                <span class="pagination-info" id="pageInfo">Showing 0-0 of 0</span>
                <div style="display:flex; gap:5px;">
                    <button class="btn-page" id="btnPrev" onclick="changePage(-1)">Previous</button>
                    <button class="btn-page" id="btnNext" onclick="changePage(1)">Next</button>
                </div>
            </div>
        </div>
    </div>

    <div id="statusModal" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <span class="close-btn" onclick="closeModal('statusModal')">&times;</span>
            <h2 style="margin-top:0; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">Update Status</h2>
            <p><strong>Member:</strong> <span id="editMember"></span></p>
            <p><strong>Skill:</strong> <span id="editSkill"></span></p>
            <p><strong>Access Code:</strong> <span id="editCode" style="font-family:monospace; font-size:0.9em; color:var(--text-muted); user-select: all;"></span></p>
            <input type="hidden" id="editId">

            <div class="form-group" style="margin-top:20px;">
                <label>New Status</label>
                <select id="editStatusSelect" class="filter-select" style="width: 100%;">
                    <option value="sent">Sent</option>
                    <option value="submitted">Submitted</option>
                    <option value="accepted">Accepted</option>
                    <option value="rejected">Rejected</option>
                    <option value="disabled">Disabled</option>
                </select>
            </div>

            <div class="modal-actions-right">
                <button onclick="saveStatus()" class="btn-primary w-100">Save Changes</button>
            </div>
        </div>
    </div>

    <button onclick="scrollToTop()" id="scrollTopBtn" title="Go to top">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
    </button>

    <script src="utils.js"></script>
    <script src="toast.js"></script>
    <script src="theme.js"></script>
    <script src="help.js"></script>
    <script>
        let appMode = 'production';
        let currentData = [];
        let currentSort = { column: 'form_sent_datetime', order: 'desc' };

        let currentPage = 1;
        let currentLimit = 25;
        let totalCount = 0;

        let appLocale = 'en-NZ';
        let appTimezone = 'Pacific/Auckland';

        const ICON_ASC = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>';
        const ICON_DESC = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
        const ICON_NONE = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3;"><path d="M7 15l5 5 5-5"/><path d="M7 9l5-5 5 5"/></svg>';

        async function init() {
            try {
                const c = await (await fetch('/ui-config')).json();
                appMode = c.appMode || 'production';
                if (c.loginTitle) {
                    document.title = "Live Forms - " + c.loginTitle;
                    document.getElementById('pageHeader').innerText = "Live Forms Management - " + c.loginTitle;
                }
                if (c.appBackground) document.body.style.backgroundImage = `url('${c.appBackground}')`;
                if (c.appMode === 'demo') document.getElementById('demoBanner').style.display = 'block';

                if (c.locale) appLocale = c.locale;
                if (c.timezone) appTimezone = c.timezone;

            } catch (e) { }

            try {
                const prefRes = await fetch('/api/user-preferences');
                const prefs = await prefRes.json();
                if (prefs.sortLiveForms) currentSort = prefs.sortLiveForms;
                if (prefs.liveFormsLimit) {
                    currentLimit = parseInt(prefs.liveFormsLimit);
                    document.getElementById('rowsPerPage').value = currentLimit;
                }
            } catch (e) { console.error("Pref error", e); }

            try {
                const mRes = await fetch('/api/members');
                const members = await mRes.json();
                const mSel = document.getElementById('filterMember');
                members.forEach(m => mSel.innerHTML += `<option value="${m.id}">${m.name}</option>`);

                const sRes = await fetch('/api/skills');
                const skills = await sRes.json();
                const sSel = document.getElementById('filterSkill');
                skills.forEach(s => sSel.innerHTML += `<option value="${s.id}">${s.name}</option>`);
            } catch (e) { }

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('memberId')) document.getElementById('filterMember').value = urlParams.get('memberId');
            if (urlParams.has('skillId')) document.getElementById('filterSkill').value = urlParams.get('skillId');
            if (urlParams.has('status')) document.getElementById('filterStatus').value = urlParams.get('status');
            updateFilterHighlights();
            
            loadData();
        }

        async function loadData() {
            const params = new URLSearchParams();
            const getVal = (id) => document.getElementById(id).value;
            const isArchived = document.getElementById('archiveToggle').checked;
            params.append('isArchived', isArchived);

            if (getVal('filterStatus')) params.append('status', getVal('filterStatus'));
            if (getVal('filterMember')) params.append('memberId', getVal('filterMember'));
            if (getVal('filterSkill')) params.append('skillId', getVal('filterSkill'));
            if (getVal('filterTries')) params.append('tries', getVal('filterTries'));
            if (getVal('filterSentStart')) params.append('sentStart', getVal('filterSentStart'));
            if (getVal('filterSentEnd')) params.append('sentEnd', getVal('filterSentEnd'));
            if (getVal('filterSubStart')) params.append('subStart', getVal('filterSubStart'));
            if (getVal('filterSubEnd')) params.append('subEnd', getVal('filterSubEnd'));

            params.append('page', currentPage);
            params.append('limit', currentLimit);

            document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" class="text-center">Loading...</td></tr>';

            try {
                const res = await fetch(`/api/live-forms?${params.toString()}`);
                if (!res.ok) throw new Error("Failed to load");
                const result = await res.json();

                currentData = result.records || [];
                totalCount = result.total || 0;

                applySort();
                updatePagination();
            } catch (e) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="7" class="text-center" style="color:var(--danger);">Error: ${e.message}</td></tr>`;
            }
        }

        function updatePagination() {
            const totalPages = Math.ceil(totalCount / currentLimit);
            const start = totalCount === 0 ? 0 : ((currentPage - 1) * currentLimit) + 1;
            const end = Math.min(currentPage * currentLimit, totalCount);

            document.getElementById('paginationControls').style.display = totalCount > 0 ? 'flex' : 'none';
            document.getElementById('pageInfo').textContent = `Showing ${start}-${end} of ${totalCount}`;
            document.getElementById('btnPrev').disabled = currentPage <= 1;
            document.getElementById('btnNext').disabled = currentPage >= totalPages;
        }

        function changePage(delta) {
            currentPage += delta;
            loadData();
        }

        function changeLimit(val) {
            currentLimit = parseInt(val);
            currentPage = 1;
            fetch('/api/user-preferences', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: 'liveFormsLimit', value: currentLimit })
            });
            loadData();
        }

        function resetFilters() {
            document.querySelectorAll('select.filter-select, input.filter-date, input[type="number"]').forEach(el => el.value = '');
            applyFilters(1);
            updateFilterHighlights();
        }

        function applyFilters(page = 1) {
            updateFilterHighlights();
            currentPage = page;
            loadData();
        }

        async function purgeFiltered() {
            const isArchived = document.getElementById('archiveToggle').checked;
            const viewLabel = isArchived ? "ARCHIVED" : "ACTIVE";

            if (!await confirmAction("Purge Records",
                `DANGER: This will delete ALL ${totalCount} ${viewLabel} records matching the current filters.\n\nThis cannot be undone. Are you sure?`)) return;

            const params = new URLSearchParams();
            const getVal = (id) => document.getElementById(id).value;

            params.append('isArchived', isArchived);
            if (getVal('filterStatus')) params.append('status', getVal('filterStatus'));
            if (getVal('filterMember')) params.append('memberId', getVal('filterMember'));
            if (getVal('filterSkill')) params.append('skillId', getVal('filterSkill'));
            if (getVal('filterTries')) params.append('tries', getVal('filterTries'));
            if (getVal('filterSentStart')) params.append('sentStart', getVal('filterSentStart'));
            if (getVal('filterSentEnd')) params.append('sentEnd', getVal('filterSentEnd'));
            if (getVal('filterSubStart')) params.append('subStart', getVal('filterSubStart'));
            if (getVal('filterSubEnd')) params.append('subEnd', getVal('filterSubEnd'));

            try {
                const res = await fetch(`/api/live-forms/all?${params.toString()}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    showToast(`Purged ${data.count} ${viewLabel.toLowerCase()} records.`, "success");
                    loadData();
                } else {
                    throw new Error(data.error);
                }
            } catch (e) {
                showToast("Purge failed: " + e.message, "error");
            }
        }

        function exportJson() {
            const params = new URLSearchParams();
            const getVal = (id) => document.getElementById(id).value;

            const isArchived = document.getElementById('archiveToggle').checked;
            params.append('isArchived', isArchived);

            if (getVal('filterStatus')) params.append('status', getVal('filterStatus'));
            if (getVal('filterMember')) params.append('memberId', getVal('filterMember'));
            if (getVal('filterSkill')) params.append('skillId', getVal('filterSkill'));
            if (getVal('filterTries')) params.append('tries', getVal('filterTries'));
            if (getVal('filterSentStart')) params.append('sentStart', getVal('filterSentStart'));
            if (getVal('filterSentEnd')) params.append('sentEnd', getVal('filterSentEnd'));
            if (getVal('filterSubStart')) params.append('subStart', getVal('filterSubStart'));
            if (getVal('filterSubEnd')) params.append('subEnd', getVal('filterSubEnd'));

            window.location.href = `/api/live-forms/export?${params.toString()}`;
        }

        function downloadSingleJson(id) {
            const record = currentData.find(r => r.id == id);
            if (!record) return;
            const filename = `live_form_${record.member_name}_${record.skill_name}.json`.replace(/[^a-z0-9._-]/gi, '_');
            const blob = new Blob([JSON.stringify(record, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function handleSort(col) {
            if (currentSort.column === col) {
                currentSort.order = currentSort.order === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = col;
                currentSort.order = 'asc';
            }
            fetch('/api/user-preferences', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: 'sortLiveForms', value: currentSort })
            }).catch(e => console.error("Failed to save preference", e));
            applySort();
        }

        function applySort() {
            currentData.sort((a, b) => {
                const valA = (a[currentSort.column] || '').toString().toLowerCase();
                const valB = (b[currentSort.column] || '').toString().toLowerCase();

                if (currentSort.column === 'tries') {
                    const numA = parseInt(a.tries) || 1;
                    const numB = parseInt(b.tries) || 1;
                    return currentSort.order === 'asc' ? numA - numB : numB - numA;
                }

                if (valA < valB) return currentSort.order === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.order === 'asc' ? 1 : -1;
                return 0;
            });
            const columns = ['member_name', 'skill_name', 'tries', 'form_sent_datetime', 'form_submitted_datetime', 'form_status'];
            columns.forEach(col => {
                const iconSpan = document.getElementById(`icon-${col}`);
                if (iconSpan) iconSpan.innerHTML = ICON_NONE;
            });
            const activeIcon = document.getElementById(`icon-${currentSort.column}`);
            if (activeIcon) activeIcon.innerHTML = currentSort.order === 'asc' ? ICON_ASC : ICON_DESC;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const isArchivedMode = document.getElementById('archiveToggle').checked;

            tbody.innerHTML = '';

            if (currentData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center" style="color:var(--text-muted); padding: 20px;">
            No ${isArchivedMode ? 'archived' : 'active'} records found matching your filters.
        </td></tr>`;
                return;
            }

            const fmtDate = (dStr) => {
                if (!dStr) return '<span style="color:var(--text-muted);">-</span>';
                return new Date(dStr).toLocaleString(appLocale, {
                    timeZone: appTimezone,
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit'
                });
            };

            currentData.forEach((row, index) => {
                const rowClass = index % 2 === 0 ? 'row-even' : 'row-odd';
                
                let scoreDisplay = '<span style="color:var(--text-muted);">-</span>';
                if (row.current_score !== null && row.current_score !== undefined) {
                    const formattedScore = `<strong>${Number(row.current_score).toFixed(1)}</strong>`;
                    if (row.form_status === 'accepted') {
                        scoreDisplay = `<span style="color:var(--success);">${formattedScore}</span>`;
                    } else if (row.form_status === 'rejected') {
                        scoreDisplay = `<span style="color:var(--danger);">${formattedScore}</span>`;
                    } else {
                        scoreDisplay = formattedScore;
                    }
                }

                let actionHtml = '';
                if (isArchivedMode) {
                    actionHtml = `
                <button class="btn-icon" onclick="openReview('${row.id}')" title="View (Read Only)">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
                <button class="btn-icon" onclick="downloadSingleJson('${row.id}')" title="Download JSON">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                </button>
                <button class="btn-icon" onclick="toggleArchive('${row.id}', false)" title="Restore (Un-archive)" style="color:var(--success);">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                </button>
                <button class="btn-icon delete" onclick="deleteRecord('${row.id}')" title="Delete Permanently">
                     <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            `;
                } else {
                    const canReview = ['submitted', 'accepted', 'rejected'].includes(row.form_status);
                    actionHtml = `
                ${canReview ? `
                <button class="btn-icon" onclick="openReview('${row.id}')" title="Review Submission" style="color:var(--info);">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>` : ''}
                <button class="btn-icon" onclick="downloadSingleJson('${row.id}')" title="Download JSON">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                </button>
                <button class="btn-icon edit" onclick="openEdit('${row.id}', '${row.member_name}', '${row.skill_name}', '${row.form_status}', '${row.form_access_code}')" title="Edit Status">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                </button>
                <button class="btn-icon delete" onclick="deleteRecord('${row.id}')" title="Delete">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            `;
                }

                const tr = document.createElement('tr');
                tr.className = rowClass;
                tr.innerHTML = `
            <td data-label="Member">${row.member_name || 'Unknown'}</td>
            <td data-label="Skill">${row.skill_name || 'Unknown'}</td>
            <td data-label="Tries" class="text-center">${row.tries || 1}</td>
            <td data-label="Score" class="text-center">${scoreDisplay}</td>
            <td data-label="Dates" style="font-size:0.8em; line-height:1.4; white-space:nowrap;">
                <div title="Sent Date"><span style="color:var(--text-muted); font-weight:bold;">S:</span> ${fmtDate(row.form_sent_datetime)}</div>
                <div title="Submitted Date"><span style="color:var(--text-muted); font-weight:bold;">U:</span> ${fmtDate(row.form_submitted_datetime)}</div>
                <div title="Reviewed Date"><span style="color:var(--text-muted); font-weight:bold;">R:</span> ${fmtDate(row.form_reviewed_datetime)}</div>
            </td>
            <td data-label="Status" class="text-center"><span class="badge status-${row.form_status}">${row.form_status}</span></td>
            <td data-label="Actions" class="text-center ws-nowrap">${actionHtml}</td>
        `;
                tbody.appendChild(tr);
            });
        }

        async function toggleArchive(id, newState) {
            const label = newState ? 'Archive' : 'Restore';
            if (!await confirmAction(`${label} Record`, `Are you sure you want to ${label.toLowerCase()} this record?`)) return;

            try {
                const res = await fetch(`/api/live-forms/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isArchived: newState })
                });
                if (res.ok) {
                    showToast(`Record ${newState ? 'archived' : 'restored'} successfully`, "success");
                    loadData();
                } else throw new Error("Update failed");
            } catch (e) {
                showToast("Error: " + e.message, "error");
            }
        }

        function openReview(id) { window.open(`forms-view.html?reviewId=${id}`, '_blank'); }

        function openEdit(id, member, skill, status, code) {
            document.getElementById('editId').value = id;
            document.getElementById('editMember').textContent = member;
            document.getElementById('editSkill').textContent = skill;
            document.getElementById('editCode').textContent = code || 'N/A';
            document.getElementById('editStatusSelect').value = status;
            document.getElementById('statusModal').style.display = 'block';
        }

        async function saveStatus() {
            const id = document.getElementById('editId').value;
            const status = document.getElementById('editStatusSelect').value;
            try {
                const res = await fetch(`/api/live-forms/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }) });
                if (res.ok) { closeModal('statusModal'); loadData(); showToast("Status updated", "success"); } else throw new Error("Update failed");
            } catch (e) { showToast(e.message, "error"); }
        }

        async function deleteRecord(id) {
            if (!await confirmAction("Delete Record", "Are you sure you want to delete this record? This cannot be undone.")) return;
            try {
                await fetch(`/api/live-forms/${id}`, { method: 'DELETE' });
                loadData();
                showToast("Record deleted", "success");
            } catch (e) { showToast("Delete failed", "error"); }
        }

        window.addEventListener('focus', () => {
            if (document.getElementById('tableBody')) {
                loadData(); 
            }
        });

        function updateFilterHighlights() {
            const filterIds = [
                'filterStatus', 'filterMember', 'filterSkill', 'filterTries',
                'filterSentStart', 'filterSentEnd', 'filterSubStart', 'filterSubEnd'
            ];

            filterIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    if (el.value && el.value.trim() !== "") {
                        el.classList.add('filter-active');
                    } else {
                        el.classList.remove('filter-active');
                    }
                }
            });
        }
        
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        window.onclick = (e) => { if (e.target.classList.contains('modal')) e.target.style.display = 'none'; }
        
        const scrollTopBtn = document.getElementById("scrollTopBtn");
        window.onscroll = function () { if (scrollTopBtn) scrollTopBtn.style.display = (window.scrollY > 200) ? "flex" : "none"; };
        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        init();
    </script>
</body>
</html>
