<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="resources/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#17A2B8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="stylesheet" href="/sidebar.css">
    <script src="/js/sidebar.js"></script>
    <style>
        /* Toolbar mobile/desktop variants */
        .toolbar-btn-mobile { display: none; }

        /* Card list hidden on desktop */
        #cardList { display: none; }

        /* Sort bar hidden on desktop */
        #lf-sort-bar { display: none; }

        @media (max-width: 768px) {
            /* Toolbar swap */
            .toolbar-btn-desktop { display: none; }
            .toolbar-btn-mobile {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 36px;
                height: 36px;
                padding: 0;
                border-radius: 6px;
            }

            /* Desktop table hidden, cards visible */
            #tableWrapper { display: none; }
            #cardList { display: block; }

            /* Sort bar: hidden by default, shown when expanded (accordion) */
            #lf-sort-bar { display: none; }
            #lf-sort-bar.sort-expanded { display: flex; }

            /* Filter bar: hidden by default, shown when expanded (accordion) */
            .filter-bar {
                display: none;
                flex-direction: column;
                gap: 6px;
                padding: 8px 10px;
                background: var(--bg-card);
                border: 1px solid var(--border-color);
                border-radius: 8px;
                margin-bottom: 10px;
            }
            .filter-bar.filter-expanded { display: flex; }
            /* Inline layout: label left, control right.
               flex: 0 0 auto !important overrides inline flex values (e.g. flex: 0 1 100px)
               which in column-direction inflate group height. */
            .filter-bar .filter-group {
                flex: 0 0 auto !important;
                flex-direction: row !important;
                align-items: center;
                gap: 8px;
                min-width: unset;
                width: 100%;
            }
            .filter-bar .filter-group > label {
                min-width: 7.5em;
                font-size: 12px;
                flex-shrink: 0;
                white-space: nowrap;
            }
            .filter-bar .filter-group > input,
            .filter-bar .filter-group > select,
            .filter-bar .filter-group > div { flex: 1; min-width: 0; }
            /* Date filter groups: stack label above inputs so the two date pickers get full width */
            .filter-bar .filter-group-date {
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 4px;
            }
            .filter-bar .filter-group-date > label { min-width: unset; }
            .filter-bar .date-range-container { flex-direction: row !important; align-items: center; gap: 6px; width: 100%; }
            .filter-bar .date-range-container .filter-date { width: auto !important; flex: 1; min-width: 0; }
            .filter-bar .filter-actions { flex-direction: row; justify-content: flex-end; gap: 8px; }

            /* Keep the tools-bar buttons on one row on mobile */
            .tools-bar {
                flex-direction: row;
                align-items: center;
                flex-wrap: nowrap;
                gap: 8px;
            }
        }
    </style>
</head>

    <script>
        let liveFormsTable;
        let appLocale = 'en-NZ';
        let appTimezone = 'Pacific/Auckland';
        let isDemo = false;

        function parseRankAndName(fullName) {
            const parts = (fullName || '').trim().split(' ');
            if (parts.length > 1 && /^[A-Za-z]{2,4}$/.test(parts[0])) {
                return { rank: parts[0], displayName: parts.slice(1).join(' ') };
            }
            return { rank: "-", displayName: fullName || '' };
        }

        async function init() {
            try {
                const c = await (await fetch('/ui-config')).json();
                initPageTitle("Live Forms", "Live Forms Management");
                if (c.appBackground) document.body.style.backgroundImage = `url('${c.appBackground}')`;
                if (c.appMode === 'demo') document.getElementById('demoBanner').style.display = 'block';
                isDemo = c.appMode === 'demo';
                if (c.locale) appLocale = c.locale;
                if (c.timezone) appTimezone = c.timezone;
            } catch (e) { }

            let initialLimit = 25;
            let initialSort = { column: 'form_sent_datetime', order: 'desc' };

            try {
                const prefRes = await fetch('/api/user-preferences');
                const prefs = await prefRes.json();
                if (prefs.sortLiveForms) initialSort = prefs.sortLiveForms;
                if (prefs.liveFormsLimit) {
                    const saved = prefs.liveFormsLimit;
                    initialLimit = saved === 'all' ? 99999 : parseInt(saved);
                    document.getElementById('rowsPerPage').value = saved;
                    document.getElementById('rowsPerPageMobile').value = saved;
                }
            } catch (e) { console.error("Pref error", e); }

            try {
                const mRes = await fetch('/api/members');
                const members = await mRes.json();
                const mSel = document.getElementById('filterMember');
                mSel.innerHTML = '<option value="">All Members</option>';
                members.forEach(m => mSel.innerHTML += `<option value="${m.id}">${m.name}</option>`);

                const sRes = await fetch('/api/skills');
                const skills = await sRes.json();
                const sSel = document.getElementById('filterSkill');
                sSel.innerHTML = '<option value="">All Skills</option>';
                skills.forEach(s => sSel.innerHTML += `<option value="${s.id}">${s.name}</option>`);
            } catch (e) { }

            liveFormsTable = new TableController({
                tbodyId: 'tableBody',
                emptyMessage: 'No records found matching your filters.',
                initialSort: initialSort,
                initialLimit: initialLimit,
                pagination: {
                    containerId: 'paginationControls',
                    infoId: 'pageInfo',
                    firstId: 'btnFirst',
                    prevId: 'btnPrev',
                    nextId: 'btnNext',
                    lastId: 'btnLast',
                    onPageChange: (newPage, newLimit) => loadData()
                },
                onSortChange: (newSort) => {
                    fetch('/api/user-preferences', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ key: 'sortLiveForms', value: newSort })
                    });
                },
                onRenderComplete: () => {
                    updatePageInfoFormat();
                    renderCards();
                },
                sortFunction: (a, b, sortState) => {
                    const parsedA = parseRankAndName(a.member_name);
                    const parsedB = parseRankAndName(b.member_name);
                    let valA, valB;
                    if (sortState.column === 'member_rank') {
                        valA = parsedA.rank.toLowerCase();
                        valB = parsedB.rank.toLowerCase();
                    } else if (sortState.column === 'member_name') {
                        valA = parsedA.displayName.toLowerCase();
                        valB = parsedB.displayName.toLowerCase();
                    } else if (sortState.column === 'tries') {
                        const numA = parseInt(a.tries) || 1;
                        const numB = parseInt(b.tries) || 1;
                        return sortState.order === 'asc' ? numA - numB : numB - numA;
                    } else {
                        valA = (a[sortState.column] || '').toString().toLowerCase();
                        valB = (b[sortState.column] || '').toString().toLowerCase();
                    }
                    if (valA < valB) return sortState.order === 'asc' ? -1 : 1;
                    if (valA > valB) return sortState.order === 'asc' ? 1 : -1;
                    return 0;
                },
                renderRow: (row, index) => {
                    const rowClass = index % 2 === 0 ? 'row-even' : 'row-odd';
                    const isArchivedMode = document.getElementById('archiveToggle').checked;
                    const scoreDisplay = buildScoreDisplay(row);
                    const actionHtml = buildActionHtml(row, isArchivedMode);
                    const { rank, displayName } = parseRankAndName(row.member_name);

                    const tr = document.createElement('tr');
                    tr.className = rowClass;
                    tr.innerHTML = `
                        <td data-label="Rank" class="text-center">${formatRankCell(rank)}</td>
                        <td data-label="Name" style="font-weight:bold;">${displayName || 'Unknown'}</td>
                        <td data-label="Skill">${row.skill_name || 'Unknown'}</td>
                        <td data-label="Tries" class="text-center">${row.tries || 1}</td>
                        <td data-label="Score" class="text-center">${scoreDisplay}</td>
                        <td data-label="Dates" style="font-size:0.8em; line-height:1.4; white-space:nowrap;">
                            <div title="Sent Date"><span style="color:var(--text-muted); font-weight:bold;">S:</span> ${fmtDate(row.form_sent_datetime)}</div>
                            <div title="Submitted Date"><span style="color:var(--text-muted); font-weight:bold;">U:</span> ${fmtDate(row.form_submitted_datetime)}</div>
                            <div title="Reviewed Date"><span style="color:var(--text-muted); font-weight:bold;">R:</span> ${fmtDate(row.form_reviewed_datetime)}</div>
                        </td>
                        <td data-label="Status" class="text-center"><span class="badge status-${row.form_status}">${row.form_status}</span></td>
                        <td data-label="Actions" class="text-center ws-nowrap">${actionHtml}</td>
                    `;
                    return tr;
                }
            });

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('memberId')) document.getElementById('filterMember').value = urlParams.get('memberId');
            if (urlParams.has('skillId')) document.getElementById('filterSkill').value = urlParams.get('skillId');
            if (urlParams.has('status')) document.getElementById('filterStatus').value = urlParams.get('status');

            updateFilterHighlights();
            loadData();
        }

        // --- Shared helpers ---

        function fmtDate(dStr) {
            if (!dStr) return '<span style="color:var(--text-muted);">-</span>';
            return new Date(dStr).toLocaleString(appLocale, {
                timeZone: appTimezone,
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function buildScoreDisplay(row) {
            if (row.current_score === null || row.current_score === undefined) {
                return '<span style="color:var(--text-muted);">-</span>';
            }
            const formatted = `<strong>${Number(row.current_score).toFixed(1)}</strong>`;
            if (row.form_status === 'accepted') return `<span style="color:var(--success);">${formatted}</span>`;
            if (row.form_status === 'rejected') return `<span style="color:var(--danger);">${formatted}</span>`;
            return formatted;
        }

        function buildActionHtml(row, isArchivedMode) {
            if (isArchivedMode) {
                return `
                    <button class="btn-icon" onclick="openReview('${row.id}')" title="View submission (read only)">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                    <button class="btn-icon" onclick="downloadSingleJson('${row.id}')" title="Download record as JSON">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    </button>
                    <button class="btn-icon" onclick="toggleArchive('${row.id}', false)" title="Restore (un-archive) this record" style="color:var(--success);">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    </button>
                    <button class="btn-icon delete" onclick="deleteRecord('${row.id}')" title="Permanently delete this record">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </button>
                `;
            }
            const canReview = ['submitted', 'accepted', 'rejected'].includes(row.form_status);
            return `
                ${canReview ? `
                <button class="btn-icon" onclick="openReview('${row.id}')" title="Review this submission" style="color:var(--info);">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>` : ''}
                <button class="btn-icon" onclick="downloadSingleJson('${row.id}')" title="Download record as JSON">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                </button>
                <button class="btn-icon edit" onclick="openEdit('${row.id}', '${row.member_name}', '${row.skill_name}', '${row.form_status}', '${row.form_access_code}')" title="Edit form status">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                </button>
                <button class="btn-icon delete" onclick="deleteRecord('${row.id}')" title="Permanently delete this record">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            `;
        }

        // --- Page info: override TableController's range format with "X of Y" ---
        function updatePageInfoFormat() {
            const totalPages = Math.max(1, Math.ceil(liveFormsTable.total / liveFormsTable.limit));
            const text = `${liveFormsTable.page} of ${totalPages}`;
            const info = document.getElementById('pageInfo');
            if (info) info.textContent = text;
        }

        // --- Mobile card rendering ---
        function renderCards() {
            const container = document.getElementById('cardContainer');
            if (!container) return;
            const data = liveFormsTable.data;
            const isArchivedMode = document.getElementById('archiveToggle').checked;

            container.innerHTML = '';

            if (!data || data.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:20px;">${liveFormsTable.emptyMessage}</p>`;
                syncMobilePagination(false);
                return;
            }

            data.forEach(row => {
                const { rank, displayName } = parseRankAndName(row.member_name);
                const rankHtml = (rank && rank !== '-') ? `<div class="card-rank">${formatRankCell(rank)}</div>` : '';
                const scoreDisplay = buildScoreDisplay(row);
                const canReview = ['submitted', 'accepted', 'rejected'].includes(row.form_status);

                const card = document.createElement('div');
                card.className = 'table-card';
                card.innerHTML = `
                    <div class="card-header">
                        ${rankHtml}
                        <span class="card-title">${displayName || 'Unknown'}</span>
                        <span class="badge status-${row.form_status}">${row.form_status}</span>
                    </div>
                    <div class="card-body">
                        <div class="card-row"><span class="card-label">Skill:</span><span>${row.skill_name || 'Unknown'}</span></div>
                        <div class="card-row"><span class="card-label">Tries:</span><span>${row.tries || 1}</span></div>
                        <div class="card-row"><span class="card-label">Score:</span><span>${scoreDisplay}</span></div>
                        <div class="card-row"><span class="card-label">Sent:</span><span style="font-size:0.88em;">${fmtDate(row.form_sent_datetime)}</span></div>
                        <div class="card-row"><span class="card-label">Uploaded:</span><span style="font-size:0.88em;">${fmtDate(row.form_submitted_datetime)}</span></div>
                        <div class="card-row"><span class="card-label">Reviewed:</span><span style="font-size:0.88em;">${fmtDate(row.form_reviewed_datetime)}</span></div>
                    </div>
                    <div class="card-actions">
                        ${isArchivedMode ? `
                            ${canReview ? `<button class="btn-informative btn-sm" onclick="openReview('${row.id}')" title="View submission (read only)">View</button>` : ''}
                            <button class="btn-primary btn-sm" onclick="downloadSingleJson('${row.id}')" title="Download record as JSON">JSON</button>
                            <button class="btn-success btn-sm" onclick="toggleArchive('${row.id}', false)" title="Restore (un-archive) this record">Restore</button>
                            <button class="btn-danger btn-sm" onclick="deleteRecord('${row.id}')" title="Permanently delete this record">Delete</button>
                        ` : `
                            ${canReview ? `<button class="btn-informative btn-sm" onclick="openReview('${row.id}')" title="Review this submission">Review</button>` : ''}
                            <button class="btn-primary btn-sm" onclick="downloadSingleJson('${row.id}')" title="Download record as JSON">JSON</button>
                            <button class="btn-success btn-sm" onclick="openEdit('${row.id}', '${row.member_name}', '${row.skill_name}', '${row.form_status}', '${row.form_access_code}')" title="Edit form status">Edit</button>
                            <button class="btn-danger btn-sm" onclick="deleteRecord('${row.id}')" title="Permanently delete this record">Delete</button>
                        `}
                    </div>
                `;
                container.appendChild(card);
            });

            syncMobilePagination(true);
        }

        function syncMobilePagination(show) {
            const ctrl = document.getElementById('paginationControlsMobile');
            if (!ctrl) return;
            ctrl.style.display = show ? 'flex' : 'none';
            if (!show) return;

            const totalPages = Math.max(1, Math.ceil(liveFormsTable.total / liveFormsTable.limit));
            document.getElementById('pageInfoMobile').textContent = `${liveFormsTable.page} of ${totalPages}`;
            document.getElementById('btnFirstMobile').disabled = liveFormsTable.page <= 1;
            document.getElementById('btnPrevMobile').disabled = liveFormsTable.page <= 1;
            document.getElementById('btnNextMobile').disabled = liveFormsTable.page >= totalPages;
            document.getElementById('btnLastMobile').disabled = liveFormsTable.page >= totalPages;
            document.getElementById('rowsPerPageMobile').value = document.getElementById('rowsPerPage').value;
        }

        // --- Filter accordion ---
        function toggleFilters() {
            const bar = document.getElementById('filterBar');
            const btn = document.getElementById('filterToggleBtn');
            const expanded = bar.classList.toggle('filter-expanded');
            btn.classList.toggle('expanded', expanded);
        }

        // --- Sort accordion ---
        function toggleSortBar() {
            const bar = document.getElementById('lf-sort-bar');
            const btn = document.getElementById('sortToggleBtn');
            const expanded = bar.classList.toggle('sort-expanded');
            btn.classList.toggle('expanded', expanded);
        }

        // --- Data loading ---
        async function loadData() {
            const params = new URLSearchParams();
            const getVal = (id) => document.getElementById(id).value;
            const isArchived = document.getElementById('archiveToggle').checked;
            params.append('isArchived', isArchived);

            if (getVal('filterStatus')) params.append('status', getVal('filterStatus'));
            if (getVal('filterMember')) params.append('memberId', getVal('filterMember'));
            if (getVal('filterSkill')) params.append('skillId', getVal('filterSkill'));
            if (getVal('filterTries')) params.append('tries', getVal('filterTries'));
            if (getVal('filterSentStart')) params.append('sentStart', getVal('filterSentStart'));
            if (getVal('filterSentEnd')) params.append('sentEnd', getVal('filterSentEnd'));
            if (getVal('filterSubStart')) params.append('subStart', getVal('filterSubStart'));
            if (getVal('filterSubEnd')) params.append('subEnd', getVal('filterSubEnd'));

            params.append('page', liveFormsTable.page);
            params.append('limit', liveFormsTable.limit);

            if (window.showContainerLoader) {
                showContainerLoader(document.getElementById('tableBody'));
                showContainerLoader(document.getElementById('cardContainer'));
            }

            try {
                const res = await fetch(`/api/live-forms?${params.toString()}`);
                if (!res.ok) throw new Error("Failed to load");
                const result = await res.json();

                liveFormsTable.emptyMessage = `No ${isArchived ? 'archived' : 'active'} records found matching your filters.`;
                liveFormsTable.setData(result.records, result.total);
            } catch (e) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="8" class="text-center" style="color:var(--danger);">Error: ${e.message}</td></tr>`;
                document.getElementById('cardContainer').innerHTML = `<p style="text-align:center; color:var(--danger); padding:20px;">Error: ${e.message}</p>`;
            }
        }

        function handleSort(column) {
            liveFormsTable.handleSort(column);
        }

        function changeLimit(val) {
            liveFormsTable.setLimit(val);
            document.getElementById('rowsPerPage').value = val;
            document.getElementById('rowsPerPageMobile').value = val;
            fetch('/api/user-preferences', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: 'liveFormsLimit', value: val })
            });
        }

        function resetFilters() {
            document.querySelectorAll('select.filter-select, input.filter-date, input[type="number"]').forEach(el => el.value = '');
            applyFilters(1);
            updateFilterHighlights();
        }

        function applyFilters(page = 1) {
            updateFilterHighlights();
            liveFormsTable.page = page;
            loadData();
        }

        function updateFilterHighlights() {
            const filterIds = [
                'filterStatus', 'filterMember', 'filterSkill', 'filterTries',
                'filterSentStart', 'filterSentEnd', 'filterSubStart', 'filterSubEnd'
            ];
            let activeCount = 0;
            filterIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    const active = el.value && el.value.trim() !== '';
                    el.classList.toggle('filter-active', active);
                    if (active) activeCount++;
                }
            });
            const badge = document.getElementById('filterActiveCount');
            if (badge) {
                badge.textContent = activeCount > 0 ? activeCount : '';
                badge.style.display = activeCount > 0 ? 'inline-block' : 'none';
            }
        }

        async function toggleArchive(id, newState) {
            const label = newState ? 'Archive' : 'Restore';
            if (!await confirmAction(`${label} Record`, `Are you sure you want to ${label.toLowerCase()} this record?`)) return;
            try {
                const res = await fetch(`/api/live-forms/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isArchived: newState })
                });
                if (res.ok) {
                    showToast(`Record ${newState ? 'archived' : 'restored'} successfully`, "success");
                    loadData();
                } else throw new Error("Update failed");
            } catch (e) {
                showToast("Error: " + e.message, "error");
            }
        }

        async function purgeFiltered() {
            if (isDemo) { showToast('Disabled in demo mode.', 'warning'); return; }
            const isArchived = document.getElementById('archiveToggle').checked;
            const viewLabel = isArchived ? "ARCHIVED" : "ACTIVE";

            if (!await promptAction("Purge Records",
                `DANGER: This will permanently delete ALL <strong>${liveFormsTable.total} ${viewLabel}</strong> records matching the current filters. This cannot be undone.<br><br>Type <strong>PURGE</strong> to confirm.`,
                "PURGE")) return;

            const params = new URLSearchParams();
            const getVal = (id) => document.getElementById(id).value;
            params.append('isArchived', isArchived);
            if (getVal('filterStatus')) params.append('status', getVal('filterStatus'));
            if (getVal('filterMember')) params.append('memberId', getVal('filterMember'));
            if (getVal('filterSkill')) params.append('skillId', getVal('filterSkill'));
            if (getVal('filterTries')) params.append('tries', getVal('filterTries'));
            if (getVal('filterSentStart')) params.append('sentStart', getVal('filterSentStart'));
            if (getVal('filterSentEnd')) params.append('sentEnd', getVal('filterSentEnd'));
            if (getVal('filterSubStart')) params.append('subStart', getVal('filterSubStart'));
            if (getVal('filterSubEnd')) params.append('subEnd', getVal('filterSubEnd'));

            try {
                const res = await fetch(`/api/live-forms/all?${params.toString()}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    showToast(`Purged ${data.count} ${viewLabel.toLowerCase()} records.`, "success");
                    loadData();
                } else {
                    throw new Error(data.error);
                }
            } catch (e) {
                showToast("Purge failed: " + e.message, "error");
            }
        }

        function exportJson() {
            const params = new URLSearchParams();
            const getVal = (id) => document.getElementById(id).value;
            const isArchived = document.getElementById('archiveToggle').checked;
            params.append('isArchived', isArchived);
            if (getVal('filterStatus')) params.append('status', getVal('filterStatus'));
            if (getVal('filterMember')) params.append('memberId', getVal('filterMember'));
            if (getVal('filterSkill')) params.append('skillId', getVal('filterSkill'));
            if (getVal('filterTries')) params.append('tries', getVal('filterTries'));
            if (getVal('filterSentStart')) params.append('sentStart', getVal('filterSentStart'));
            if (getVal('filterSentEnd')) params.append('sentEnd', getVal('filterSentEnd'));
            if (getVal('filterSubStart')) params.append('subStart', getVal('filterSubStart'));
            if (getVal('filterSubEnd')) params.append('subEnd', getVal('filterSubEnd'));
            window.location.href = `/api/live-forms/export?${params.toString()}`;
        }

        function downloadSingleJson(id) {
            const record = liveFormsTable.data.find(r => r.id == id);
            if (!record) return;
            const filename = `live_form_${record.member_name}_${record.skill_name}.json`.replace(/[^a-z0-9._-]/gi, '_');
            const blob = new Blob([JSON.stringify(record, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function openReview(id) { window.open(`forms-view.html?reviewId=${id}`, '_blank'); }

        function openEdit(id, member, skill, status, code) {
            document.getElementById('editId').value = id;
            document.getElementById('editMember').textContent = member;
            document.getElementById('editSkill').textContent = skill;
            document.getElementById('editCode').textContent = code || 'N/A';
            document.getElementById('editStatusSelect').value = status;
            document.getElementById('statusModal').style.display = 'block';
        }

        async function saveStatus() {
            if (isDemo) { showToast('Disabled in demo mode.', 'warning'); return; }
            const id = document.getElementById('editId').value;
            const status = document.getElementById('editStatusSelect').value;
            try {
                const res = await fetch(`/api/live-forms/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                if (res.ok) {
                    closeModal('statusModal');
                    loadData();
                    showToast("Status updated", "success");
                } else throw new Error("Update failed");
            } catch (e) { showToast(e.message, "error"); }
        }

        async function deleteRecord(id) {
            if (isDemo) { showToast('Disabled in demo mode.', 'warning'); return; }
            if (!await confirmAction("Delete Record", "Are you sure you want to delete this record? This cannot be undone.")) return;
            try {
                await fetch(`/api/live-forms/${id}`, { method: 'DELETE' });
                loadData();
                showToast("Record deleted", "success");
            } catch (e) { showToast("Delete failed", "error"); }
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        window.onclick = (e) => { if (e.target.classList.contains('modal')) e.target.style.display = 'none'; }

        window.addEventListener('focus', () => {
            if (document.getElementById('tableBody')) loadData();
        });

        const scrollTopBtn = document.getElementById("scrollTopBtn");
        window.onscroll = function () {
            if (scrollTopBtn) scrollTopBtn.style.display = (window.scrollY > 200) ? "flex" : "none";
        };
        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        init();
    </script>
    <script src="/js/pwa.js"></script>

</body>

</html>
