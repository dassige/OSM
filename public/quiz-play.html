<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="resources/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#17A2B8">
    <title id="pageTitle">Quiz - OpReady</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: var(--bg-body);
            padding-top: 20px;
        }

        .form-container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px var(--shadow);
            border: 1px solid var(--border-color);
        }

        .form-header {
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .form-title {
            margin: 0 0 10px 0;
            color: var(--primary);
        }

        .form-intro {
            color: var(--text-muted);
        }

        /* Timed play is mobile-first — keep the title no bigger than the question
           counter so the answer buttons get most of the vertical space. */
        #timedGameName, #timedQuestionCounter {
            font-size: 1em;
        }

        .question-card {
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 6px;
        }

        .question-text {
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text-main);
            font-size: 1.1em;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            margin-bottom: 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            border-color: var(--primary);
            background: var(--bg-hover);
        }

        .btn-submit {
            background: var(--success);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-weight: bold;
        }

        .public-member-header {
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 25px;
        }

        /* --- REVIEW MODE STYLES (mirrors forms-view.html) --- */
        body.review-mode .option-label.review-correct {
            background-color: #d4edda !important;
            border: 2px solid #28a745 !important;
            color: #155724 !important;
            font-weight: bold !important;
        }

        body.review-mode .option-label.review-wrong {
            background-color: #f8d7da !important;
            border: 2px solid #dc3545 !important;
            color: #721c24 !important;
        }

        body.review-mode .option-label.expected-border {
            border: 3px dashed #28a745 !important;
            box-shadow: 0 0 8px rgba(40, 167, 69, 0.4);
        }

        body.review-mode .review-unanswered {
            background-color: #fff3cd !important;
            border-color: #ffeeba !important;
            color: #856404;
        }

        .reference-box {
            background: var(--bg-hover);
            border-left: 4px solid var(--primary);
            padding: 12px;
            margin-top: 10px;
            font-size: 0.9em;
            color: var(--primary);
        }

        .review-info-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px var(--shadow);
        }

        /* --- Timed play (live-clock, speed-scored) --- */
        .timer-bar-wrap {
            width: 100%;
            height: 10px;
            background: var(--bg-hover);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .timer-bar-fill {
            height: 100%;
            background: var(--success);
            width: 100%;
        }
        #timedQuestionText {
            font-weight: bold;
            font-size: 1.3em;
            text-align: center;
            margin: 10px 0 25px 0;
            color: var(--text-main);
        }
        .timed-options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 480px) {
            .timed-options-grid { grid-template-columns: 1fr; }
        }
        .timed-option-btn {
            position: relative;
            padding: 20px 15px;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1.05em;
            font-weight: bold;
            cursor: pointer;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .timed-option-btn:disabled { cursor: default; opacity: 0.55; }
        .timed-option-btn.my-answer { box-shadow: 0 0 0 4px #ffffff inset; }
        .reveal-mark {
            position: absolute;
            top: 6px;
            left: 6px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.28);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .my-answer-label {
            font-size: 0.7em;
            font-weight: normal;
            opacity: 0.9;
            margin-top: 4px;
        }
        #timedWaitingMsg {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            margin-top: 15px;
        }
        .timed-leaderboard-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 8px;
            background: var(--bg-hover);
        }
        .timed-leaderboard-row .rank {
            font-weight: bold;
            color: var(--primary);
            width: 30px;
        }
        .timed-leaderboard-row .score {
            font-weight: bold;
        }
        .timed-leaderboard-row .lb-join-code {
            font-family: monospace;
            font-weight: bold;
            letter-spacing: 0.1em;
            color: var(--primary);
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="loading" class="spinner" style="margin: 50px auto; display:block;"></div>
        <div id="formContent" class="form-container" style="display:none;">
            <div class="form-header">
                <h1 id="gameName" class="form-title"></h1>
                <p id="gameDescription" class="form-intro"></p>
            </div>
            <div id="publicMemberHeader" class="public-member-header" style="display:none;">
                <p id="playingAsLabel" style="margin:0; font-size:0.85em; color:var(--text-muted); text-transform:uppercase; font-weight:bold;">Playing as</p>
                <p id="memberNameDisplay" style="margin:2px 0 0 0; font-size:1.2em; font-weight:bold; color:var(--primary);"></p>
            </div>
            <form id="quizForm">
                <div id="questionsContainer"></div>
                <button type="submit" class="btn-submit" id="btnSubmitAnswers">Submit Answers</button>
            </form>
        </div>
        <div id="timedPlayContainer" class="form-container" style="display:none;">
            <div class="form-header">
                <h1 id="timedGameName" class="form-title"></h1>
                <p id="timedPlayingAs" class="form-intro"></p>
            </div>
            <div id="timedQuestionCounter" style="text-align:center; font-weight:bold; color:var(--text-muted); margin-bottom:12px;"></div>
            <div class="timer-bar-wrap">
                <div id="timerBarFill" class="timer-bar-fill"></div>
            </div>
            <div id="timedQuestionText"></div>
            <div id="timedOptionsGrid" class="timed-options-grid"></div>
            <div id="timedWaitingMsg" style="display:none;"></div>
            <div id="timedLeaderboardBox" style="display:none;"></div>
        </div>
        <div id="resultBox" style="display:none; text-align:center; padding:40px;">
            <div id="resultIcon"></div>
            <h2 id="resultTitle" style="margin-top:20px;"></h2>
            <p id="resultScore" style="font-size:1.3em; font-weight:bold;"></p>
        </div>
        <div id="errorBox" style="display:none; text-align:center; color:var(--danger); padding:40px;"></div>
    </div>

    <script src="toast.js"></script>
    <script src="theme.js"></script>
    <script src="utils.js"></script>
    <script src="help.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Same back/forward-cache guard as quiz-join.html — a bfcache-restored
        // play page would keep showing a stale quiz (or a finished result) instead
        // of the next one if the player navigates back and forward between quizzes.
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) window.location.reload();
        });

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = String(s ?? '');
            return d.innerHTML;
        }

        function showError(msg) {
            document.getElementById('loading').style.display = 'none';
            const box = document.getElementById('errorBox');
            box.textContent = msg;
            box.style.display = 'block';
        }

        function showResult(achieved, maxScore) {
            clearInterval(timedTickHandle);
            if (timedSocket) { timedSocket.disconnect(); timedSocket = null; }
            document.getElementById('loading').style.display = 'none';
            document.getElementById('formContent').style.display = 'none';
            document.getElementById('timedPlayContainer').style.display = 'none';
            const pct = maxScore > 0 ? Math.round((achieved / maxScore) * 100) : 0;
            document.getElementById('resultIcon').innerHTML =
                '<svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="#28a745" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
            document.getElementById('resultTitle').textContent = 'Quiz Complete!';
            document.getElementById('resultScore').textContent = `You scored ${achieved} / ${maxScore} (${pct}%)`;
            document.getElementById('resultBox').style.display = 'block';
        }

        function formatDate(dateStr, uiConfig) {
            if (!dateStr) return '';
            let safeDateStr = dateStr;
            if (!safeDateStr.includes('Z')) safeDateStr = safeDateStr.replace(' ', 'T') + 'Z';
            const locale = (uiConfig && uiConfig.locale) || navigator.language || 'en-NZ';
            const timeZone = (uiConfig && uiConfig.timezone) || Intl.DateTimeFormat().resolvedOptions().timeZone;
            return new Date(safeDateStr).toLocaleString(locale, { timeZone });
        }

        function renderReview(data, uiConfig) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('formContent').style.display = 'block';
            document.body.classList.add('review-mode');

            document.getElementById('gameName').textContent = data.sessionName || 'Quiz Review';
            document.getElementById('gameDescription').textContent = '';
            document.getElementById('publicMemberHeader').style.display = 'none';
            document.getElementById('btnSubmitAnswers').style.display = 'none';

            const pct = data.maxScore > 0 ? Math.round((data.achievedScore / data.maxScore) * 100) : 0;
            const whoLabel = data.teamName ? 'Team' : 'Member';
            const whoValue = data.teamName || data.member;
            const infoPanel = document.createElement('div');
            infoPanel.className = 'review-info-panel';
            infoPanel.innerHTML = `
                <p style="margin:5px 0;"><strong>${whoLabel}:</strong> ${esc(whoValue)}</p>
                <p style="margin:5px 0;"><strong>Score:</strong> ${data.achievedScore} / ${data.maxScore} points (${pct}%)</p>
                <p style="margin:5px 0;"><strong>Submitted:</strong> ${formatDate(data.submittedAt, uiConfig)}</p>
            `;
            document.querySelector('.form-header').appendChild(infoPanel);

            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            (data.questions || []).forEach((field) => {
                const div = document.createElement('div');
                div.className = 'question-card';
                let labelHtml = `<div class="question-text">${esc(field.description)}</div>`;

                const rawSub = data.answers[field.id] || data.answers[`${field.id}[]`];
                const subArr = (Array.isArray(rawSub) ? rawSub : [rawSub]).filter((v) => v !== undefined && v !== null && v !== '').map((v) => String(v).trim());
                const correct = field.correctAnswer;
                const corrArr = (Array.isArray(correct) ? correct : [correct]).filter((v) => v !== undefined && v !== null).map((v) => String(v).trim());
                const isUnanswered = subArr.length === 0;

                let inputHtml = '';
                switch (field.type) {
                    case 'text_multi':
                        inputHtml = `<textarea rows="4" disabled style="width:100%; box-sizing:border-box; padding:12px;" class="${isUnanswered ? 'review-unanswered' : ''}">${esc(subArr.join('\n'))}</textarea>`;
                        break;
                    case 'radio':
                    case 'boolean': {
                        const opts = field.type === 'boolean' ? ['Yes', 'No'] : (field.options || []);
                        opts.forEach((o) => {
                            const val = String(o).trim();
                            const wasSubmitted = subArr.includes(val);
                            const isCorrectOption = corrArr.includes(val);
                            let cls = '';
                            if (wasSubmitted) cls = isCorrectOption ? 'review-correct' : 'review-wrong';
                            else if (isCorrectOption) cls = 'expected-border';
                            inputHtml += `<label class="option-label ${cls}"><input type="radio" disabled ${wasSubmitted ? 'checked' : ''}> ${esc(o)}</label>`;
                        });
                        break;
                    }
                    case 'checkboxes':
                        (field.options || []).forEach((o) => {
                            const val = String(o).trim();
                            const wasSubmitted = subArr.includes(val);
                            const isCorrectOption = corrArr.includes(val);
                            let cls = '';
                            if (wasSubmitted) cls = isCorrectOption ? 'review-correct' : 'review-wrong';
                            else if (isCorrectOption) cls = 'expected-border';
                            inputHtml += `<label class="option-label ${cls}"><input type="checkbox" disabled ${wasSubmitted ? 'checked' : ''}> ${esc(o)}</label>`;
                        });
                        break;
                }
                if (isUnanswered && field.type !== 'text_multi') {
                    inputHtml += `<div class="reference-box">No answer submitted for this question.</div>`;
                }

                div.innerHTML = labelHtml + inputHtml;
                container.appendChild(div);
            });
        }

        // Timed games are always played live, host-driven — even solo or as one
        // team on one device, there is no self-paced mode for this type. One
        // question is shown at a time, in sync with a launched host screen; the
        // score is computed server-side from how quickly a correct answer was
        // given. This page only renders the state the server hands it and pushes
        // the player's chosen answer — all progression (start, reveal, next
        // question) is driven by the host, and relayed here over Socket.IO.
        const TIMED_OPTION_COLORS = ['#43a047', '#2196f3', '#e53935', '#fbc02d'];
        let timedCode = null;
        let timedPlayUrlBase = null;
        let timedTickHandle = null;
        let timedSocket = null;

        function parseServerTimestamp(ts) {
            return new Date(String(ts).replace(' ', 'T') + 'Z').getTime();
        }

        function startTimedQuiz(data, playUrlBase, playCode) {
            timedCode = playCode;
            timedPlayUrlBase = playUrlBase;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('timedPlayContainer').style.display = 'block';
            renderTimedState(data);

            const kind = playUrlBase.includes('team-play') ? 'team' : 'individual';
            timedSocket = io('/quiz-live');
            timedSocket.on('connect', () => {
                timedSocket.emit('join-player', { kind, code: playCode });
                refreshTimedState();
            });
            ['question-started', 'question-revealed', 'leaderboard-shown', 'game-finished'].forEach((evt) => {
                timedSocket.on(evt, refreshTimedState);
            });
        }

        async function refreshTimedState() {
            try {
                const res = await fetch(`${timedPlayUrlBase}/${timedCode}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'This quiz link is invalid or expired.');
                if (data.status === 'submitted') return showResult(data.achievedScore, data.maxScore);
                renderTimedState(data);
            } catch (e) {
                showError(e.message);
            }
        }

        function renderTimedState(data) {
            document.getElementById('timedGameName').textContent = data.name;
            document.getElementById('timedPlayingAs').textContent = data.team
                ? `Playing as Team: ${data.team}`
                : (data.member ? `Playing as: ${data.member}` : '');

            clearInterval(timedTickHandle);
            const counter = document.getElementById('timedQuestionCounter');
            const fill = document.getElementById('timerBarFill');
            const qText = document.getElementById('timedQuestionText');
            const grid = document.getElementById('timedOptionsGrid');
            const waitingMsg = document.getElementById('timedWaitingMsg');
            const leaderboardBox = document.getElementById('timedLeaderboardBox');

            grid.style.display = 'grid';
            waitingMsg.style.display = 'none';
            leaderboardBox.style.display = 'none';

            if (data.phase === 'lobby') {
                counter.textContent = '';
                fill.style.transition = 'none';
                fill.style.width = '100%';
                qText.textContent = '';
                grid.innerHTML = '';
                waitingMsg.textContent = 'Waiting for the host to start the quiz...';
                waitingMsg.style.display = 'block';
                return;
            }

            counter.textContent = `Question ${data.currentQuestionIndex + 1} of ${data.totalQuestions}`;

            if (data.phase === 'question' || data.phase === 'reveal') {
                const q = data.currentQuestion;
                qText.textContent = q.description;
                grid.innerHTML = '';
                (q.options || []).slice(0, 4).forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'timed-option-btn';
                    const isWrongReveal = data.phase === 'reveal' && opt !== data.correctAnswer;
                    btn.style.background = isWrongReveal ? '#9e9e9e' : (TIMED_OPTION_COLORS[i] || '#888');
                    btn.dataset.option = opt;
                    const isMyAnswer = data.phase === 'reveal' && data.myAnswer !== undefined && opt === data.myAnswer;

                    let markHtml = '';
                    if (data.phase === 'reveal' && data.myAnswer !== undefined) {
                        const answeredCorrectly = data.myAnswer === data.correctAnswer;
                        if (answeredCorrectly && opt === data.correctAnswer) {
                            markHtml = `<span class="reveal-mark reveal-mark-correct">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            </span>`;
                        } else if (!answeredCorrectly && isMyAnswer) {
                            markHtml = `<span class="reveal-mark reveal-mark-wrong">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </span>`;
                        }
                    }

                    btn.innerHTML = markHtml + `${i + 1}. ${esc(opt)}` + (isMyAnswer ? '<br><span class="my-answer-label">Your answer</span>' : '');
                    if (isMyAnswer) btn.classList.add('my-answer');
                    btn.disabled = true;
                    grid.appendChild(btn);
                });

                if (data.phase === 'question') {
                    const limitMs = (parseFloat(q.timeLimitSeconds) || 20) * 1000;
                    const startedAtMs = parseServerTimestamp(data.questionStartedAt);
                    const updateBar = () => {
                        const remaining = Math.max(0, limitMs - (Date.now() - startedAtMs));
                        fill.style.transition = 'none';
                        fill.style.width = `${Math.round((remaining / limitMs) * 100)}%`;
                    };
                    updateBar();
                    timedTickHandle = setInterval(updateBar, 200);

                    if (data.hasAnsweredCurrent) {
                        waitingMsg.textContent = 'Answer locked in — waiting for the timer or other players...';
                        waitingMsg.style.display = 'block';
                    } else {
                        grid.querySelectorAll('.timed-option-btn').forEach((btn) => {
                            btn.disabled = false;
                            btn.addEventListener('click', () => submitTimedAnswer(btn.dataset.option));
                        });
                    }
                } else {
                    fill.style.transition = 'none';
                    fill.style.width = '0%';
                    waitingMsg.textContent = 'Waiting for the host to show the leaderboard...';
                    waitingMsg.style.display = 'block';
                }
                return;
            }

            grid.style.display = 'none';
            qText.textContent = '';
            if (data.phase === 'leaderboard' || data.phase === 'finished') {
                renderTimedLeaderboard(data.leaderboard || []);

                // Between questions the bar switches from a per-question countdown to
                // an overall quiz progress indicator — how many questions are done.
                fill.style.transition = 'none';
                if (data.phase === 'finished') {
                    fill.style.width = '100%';
                } else {
                    const completed = (data.currentQuestionIndex || 0) + 1;
                    const pct = data.totalQuestions > 0 ? Math.round((completed / data.totalQuestions) * 100) : 0;
                    fill.style.width = `${pct}%`;
                }

                if (data.phase === 'leaderboard') {
                    waitingMsg.textContent = 'Waiting for the host to continue to the next question...';
                    waitingMsg.style.display = 'block';
                }
            }
        }

        function renderTimedLeaderboard(leaderboard) {
            const box = document.getElementById('timedLeaderboardBox');
            box.style.display = 'block';
            box.innerHTML = leaderboard.map((row, i) => `
                <div class="timed-leaderboard-row">
                    <span class="rank">${i + 1}.</span>
                    <span style="flex:1; padding:0 10px;">${esc(row.name)} <span class="lb-join-code">${esc(row.accessCode)}</span></span>
                    <span class="score">${row.score}</span>
                </div>
            `).join('');
        }

        async function submitTimedAnswer(answer) {
            document.querySelectorAll('.timed-option-btn').forEach((btn) => { btn.disabled = true; });
            try {
                const res = await fetch(`${timedPlayUrlBase}/${timedCode}/live-answer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ answer }),
                });
                const result = await res.json();
                if (!res.ok) throw new Error(result.error || 'Failed to submit answer.');
                document.getElementById('timedWaitingMsg').textContent = 'Answer locked in — waiting for the timer or other players...';
                document.getElementById('timedWaitingMsg').style.display = 'block';
            } catch (err) {
                if (window.showToast) showToast(err.message, 'error'); else console.error(err.message);
                refreshTimedState();
            }
        }

        function renderQuestions(game) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('formContent').style.display = 'block';
            document.getElementById('gameName').textContent = game.name;
            document.getElementById('gameDescription').textContent = game.description || '';

            if (game.member || game.team) {
                document.getElementById('playingAsLabel').textContent = game.team ? 'Playing as Team' : 'Playing as';
                document.getElementById('memberNameDisplay').textContent = game.team || game.member;
                document.getElementById('publicMemberHeader').style.display = 'block';
            }

            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            (game.questions || []).forEach((field) => {
                const div = document.createElement('div');
                div.className = 'question-card';
                let labelHtml = `<div class="question-text">${esc(field.description)}</div>`;
                if (field.required) labelHtml += `<div style="text-align:right;"><span style="color:#dc3545; font-size:11px; font-weight:bold;">* Required</span></div>`;

                let inputHtml = '';
                const reqAttr = field.required ? 'required' : '';

                switch (field.type) {
                    case 'text_multi':
                        inputHtml = `<textarea name="${field.id}" rows="4" style="width:100%; box-sizing:border-box; padding:12px;" ${reqAttr}></textarea>`;
                        break;
                    case 'radio':
                    case 'boolean': {
                        const opts = field.type === 'boolean' ? ['Yes', 'No'] : (field.options || []);
                        opts.forEach((o) => {
                            inputHtml += `<label class="option-label"><input type="radio" name="${field.id}" value="${esc(o)}" ${reqAttr}> ${esc(o)}</label>`;
                        });
                        break;
                    }
                    case 'checkboxes':
                        (field.options || []).forEach((o) => {
                            inputHtml += `<label class="option-label"><input type="checkbox" name="${field.id}[]" value="${esc(o)}"> ${esc(o)}</label>`;
                        });
                        break;
                }

                div.innerHTML = labelHtml + inputHtml;
                container.appendChild(div);
            });
        }

        (async function init() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const teamCode = params.get('teamCode');
            const reviewId = params.get('reviewId');
            const reviewTeamId = params.get('reviewTeamId');

            if (reviewId || reviewTeamId) {
                let uiConfig = {};
                try {
                    const uiRes = await fetch('/ui-config');
                    uiConfig = await uiRes.json();
                } catch (e) {}
                try {
                    const reviewUrl = reviewTeamId
                        ? `/api/live-quiz/teams/${reviewTeamId}/review`
                        : `/api/live-quiz/players/${reviewId}/review`;
                    const res = await fetch(reviewUrl);
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Unable to load this submission.');
                    document.title = `${data.sessionName || 'Quiz'} - ${data.teamName || data.member} - OpReady`;
                    renderReview(data, uiConfig);
                } catch (e) {
                    showError(e.message);
                }
                return;
            }

            const playCode = teamCode || code;
            const playUrlBase = teamCode ? '/api/live-quiz/team-play' : '/api/live-quiz/play';
            if (!playCode) return showError('No quiz code provided.');

            try {
                const res = await fetch(`${playUrlBase}/${playCode}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'This quiz link is invalid or expired.');

                document.title = `${data.name || 'Quiz'} - OpReady`;

                if (data.status === 'submitted') {
                    return showResult(data.achievedScore, data.maxScore);
                }

                if (data.gameType === 'timed') {
                    return startTimedQuiz(data, playUrlBase, playCode);
                }

                renderQuestions(data);
            } catch (e) {
                showError(e.message);
                return;
            }

            document.getElementById('quizForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const answers = {};
                for (const [key, value] of formData.entries()) {
                    if (answers[key]) {
                        if (!Array.isArray(answers[key])) answers[key] = [answers[key]];
                        answers[key].push(value);
                    } else {
                        answers[key] = value;
                    }
                }

                const btn = e.target.querySelector('.btn-submit');
                btn.disabled = true;
                btn.textContent = 'Submitting...';

                try {
                    const res = await fetch(`${playUrlBase}/${playCode}/submit`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(answers),
                    });
                    const result = await res.json();
                    if (!res.ok) throw new Error(result.error || 'Submission failed.');
                    showResult(result.achievedScore, result.maxScore);
                } catch (err) {
                    btn.disabled = false;
                    btn.textContent = 'Submit Answers';
                    if (window.showToast) showToast(err.message, 'error'); else console.error(err.message);
                }
            });
        })();
    </script>
</body>
