<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reports - OpReady</title>
    <link rel="icon" type="image/x-icon" href="resources/favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="/sidebar.css">
    <script src="/js/sidebar.js"></script>
</head>

<body>
    <div id="demoBanner" class="demo-banner">
        DEMO VERSION <span style="font-weight:normal;">(<a href="demo/demo_osm_dasboard.html" target="_blank"
                style="color:inherit; text-decoration:underline;">View Source HTML</a>)</span>
    </div>

    <a href="/" class="back-btn back-dashboard-btn" title="Back to Dashboard">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>

    <div class="container" style="max-width: 1100px;">
        <h1 id="pageHeader" class="text-center" style="margin-top: 40px; margin-bottom: 30px;">Reports Console</h1>

        <div class="action-bar" style="align-items: stretch;">
            <div class="controls-area">
                <label style="font-weight:bold; color:var(--text-main);">Select Report:</label>
                <select id="reportSelect" class="filter-select" onchange="loadReportDescription()" style="width: 100%;">
                    <option value="" disabled selected>-- Choose a Report --</option>
                    <option value="by-member">Expiring Skills (By Member)</option>
                    <option value="by-skill">Expiring Skills (By Skill)</option>
                    <option value="critical-overdue">Critical Skills Overdue (Priority)</option>
                    <option value="verification-history">Forms Verification History</option>
                    <option value="compliance-matrix">Brigade Compliance Matrix</option>
                    <option value="planned-sessions">Planned Sessions (Overview)</option>
                    <option value="planned-sessions">Planned Sessions (By Date)</option>
                    <option value="training-attendance">Training Attendance Sheet</option>
                </select>

                <div style="display:flex; gap:10px; margin-top:10px;">
                    <button onclick="window.print()" class="btn-sm btn-secondary" style="margin:0;">Print</button>
                    <button onclick="downloadPdf()" class="btn-sm btn-danger" style="margin:0;">Export PDF</button>
                    <button onclick="runReport()" class="btn-sm btn-success" style="flex-grow:1; margin:0;">Run Report</button>
                </div>
            </div>

            <div id="descCard" class="desc-card">
                <strong id="descTitle">No Report Selected</strong>
                <p id="descBody">Select a report to view details.</p>
            </div>
        </div>

        <div id="reportPanel" class="report-container">
            <div style="text-align:center; color:#ccc; padding-top:100px;">
                Select a report above and click "Run Report"
            </div>
        </div>

        <div class="pagination-container" id="reportPagination" style="display:none;">
            <div class="page-limit-selector">
                <label>Items per page:</label>
                <select id="rptRowsPerPage" onchange="changeRowsPerPage(this.value)"
                    style="padding:4px 8px; border-radius:4px; border:1px solid var(--border-color); background:var(--input-bg); color:var(--text-main); height:30px;">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="all">All</option>
                </select>
            </div>
            <span class="pagination-info" id="rptPageInfo">Showing 1-10 of 0</span>
            <div style="display:flex; gap:5px;">
                <button class="btn-page" id="btnRptPrev" onclick="changePage(-1)">Previous</button>
                <button class="btn-page" id="btnRptNext" onclick="changePage(1)">Next</button>
            </div>
        </div>
    </div>

    <button onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" id="scrollTopBtn" title="Go to top">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
    </button>

    <script src="/socket.io/socket.io.js"></script>
    <script src="toast.js"></script>
    <script src="theme.js"></script>
    <script src="help.js"></script>
    <script src="utils.js"></script>
    
    <script src="reports/report-by-member.js"></script>
    <script src="reports/report-by-skill.js"></script>
    <script src="reports/report-planned-sessions.js"></script>
    <script src="reports/report-critical-overdue.js"></script>
    <script src="reports/report-compliance-matrix.js"></script>
    <script src="reports/report-verification-history.js"></script>
    <script src="reports/report-training-attendance.js"></script>

    <script src="js/reports-controller.js"></script>

    <script>
        // Scroll Button Logic
        const scrollTopBtn = document.getElementById("scrollTopBtn");
        window.onscroll = function () {
            if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
                scrollTopBtn.style.display = "flex";
            } else {
                scrollTopBtn.style.display = "none";
            }
        };
    </script>
</body>

</html>
