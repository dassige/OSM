<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Compliance Statistics - OpReady</title>
    <link rel="icon" type="image/x-icon" href="resources/favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/sidebar.css">
    <script src="/js/sidebar.js"></script>
</head>

<body>
    <div id="demoBanner" class="demo-banner">
        DEMO VERSION <span style="font-weight:normal;">(<a href="demo/demo_osm_dasboard.html" target="_blank"
                style="color:inherit; text-decoration:underline;">View Source HTML</a>)</span>
    </div>

    <a href="/" class="back-btn back-dashboard-btn" title="Back to Dashboard">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>

    <div class="container" style="max-width: 1100px;">
        <h1 id="pageHeader" class="text-center" style="margin-top: 40px; margin-bottom: 30px;">Statistics Dashboard</h1>

        <div class="action-bar" style="align-items: stretch;">
            <div class="controls-area">
                <label style="font-weight:bold; color: var(--text-main);">Select Statistic View:</label>
                <select id="statSelect" onchange="loadStatDescription()" class="filter-select" style="width: 100%;">
                    <option value="" disabled selected>-- Choose a View --</option>
                    <option value="compliance-overview">Overall Compliance Overview</option>
                </select>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <button onclick="window.print()" class="btn-sm btn-primary" style="margin:0;">Print</button>
                    <button onclick="downloadPdf()" class="btn-sm btn-primary" style="margin:0;">Export PDF</button>
                    <button onclick="runStat()" class="btn-sm btn-primary" style="flex-grow:1; margin:0;">Refresh Data</button>
                </div>
            </div>
            
            <div id="descCard" class="desc-card">
                <strong id="descTitle">No Statistic Selected</strong>
                <p id="descBody">Select a view to visualize compliance data.</p>
            </div>
        </div>

        <div id="statPanel" class="report-container">
            <div style="text-align:center; color:#ccc; padding-top:100px;">Select a view above and click "Refresh Data"
            </div>
        </div>
    </div>

    <button onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" id="scrollTopBtn" title="Go to top">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
    </button>

    <script src="/socket.io/socket.io.js"></script>
    <script src="toast.js"></script>
    <script src="theme.js"></script>
    <script src="help.js"></script>
    <script src="utils.js"></script>
    <script src="statistics/compliance-overview.js"></script>
    <script src="js/statistics-controller.js"></script>
    <script>
        fetch('/ui-config').then(r => r.json()).then(c => {
            if (c.loginTitle) {
                document.title = "Compliance Statistics - " + c.loginTitle;
                document.getElementById('pageHeader').innerText = "Statistics Dashboard - " + c.loginTitle;
            }
            if (c.appBackground) document.body.style.backgroundImage = `url('${c.appBackground}')`;
            if (c.appMode === 'demo') document.getElementById('demoBanner').style.display = 'block';
        });
    </script>
</body>

</html>
