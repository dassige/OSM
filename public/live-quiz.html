<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="resources/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#17A2B8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OpReady">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title id="pageTitle">Live Quiz - OpReady</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="/sidebar.css">
    <script src="/js/sidebar.js"></script>
    <style>
        .status-badge { padding:4px 8px; border-radius:4px; font-size:11px; font-weight:bold; text-transform:uppercase; letter-spacing:0.5px; }
        .status-active { background: rgba(40, 167, 69, 0.15); color: #28a745; border: 1px solid rgba(40, 167, 69, 0.3); }
        .status-archived { background: rgba(108, 117, 125, 0.15); color: #888; border: 1px solid rgba(108, 117, 125, 0.3); }
        .type-badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:0.75em; font-weight:600; color:#fff; }
        .type-badge-score { background: #17a2b8; }
        .type-badge-timed { background: #fd7e14; }
        .player-status-sent { color: var(--text-muted); }
        .player-status-submitted { color: var(--success); font-weight:600; }

        #sessionsCardList { display: none; }
        #sl-sort-bar { display: none; }
        .toolbar-btn-mobile { display: none; }
        #playersCardList { display: none; }
        #players-sort-bar { display: none; }
        #teamSessionsCardList { display: none; }
        #tsl-sort-bar { display: none; }

        @media (max-width: 768px) {
            .toolbar-btn-desktop { display: none; }
            .toolbar-btn-mobile { display: inline-flex; align-items:center; justify-content:center; width:36px; height:36px; padding:0; border-radius:6px; }
            #sessionsTableWrapper { display: none; }
            #sessionsCardList { display: block; }
            #sl-sort-bar { display: none; }
            #sl-sort-bar.sort-expanded { display: flex; }
            #playersTableWrapper { display: none; }
            #playersCardList { display: block; }
            #players-sort-bar { display: none; }
            #players-sort-bar.sort-expanded { display: flex; }
            #teamSessionsTableWrapper { display: none; }
            #teamSessionsCardList { display: block; }
            #tsl-sort-bar { display: none; }
            #tsl-sort-bar.sort-expanded { display: flex; }
        }

        /* ── Tab navigation ── */
        .lq-tab-nav {
            display: flex; gap: 8px; background: var(--bg-hover);
            border: 1px solid var(--border-color); border-radius: 10px; padding: 6px;
            margin-bottom: 20px;
        }
        .lq-tab-btn {
            flex: 1; display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; padding: 10px 16px; min-height: 44px;
            background: transparent; border: none; border-radius: 7px;
            color: var(--text-muted); font-size: 0.95em; cursor: pointer;
            transition: background 0.18s, color 0.18s;
        }
        .lq-tab-btn:hover:not(.active) { background: var(--bg-card); color: var(--text-main); }
        .lq-tab-btn.active { background: var(--primary); color: #fff; font-weight: 600; }
        .lq-tab-panel { display: none; }
        .lq-tab-panel.active { display: block; }

        /* ── Team cards (team-session detail view) ── */
        .team-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
        }
        .team-roster-item {
            padding: 4px 0;
            font-size: 0.92em;
        }
        .team-access-code {
            font-family: monospace;
            font-size: 0.82em;
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 8px;
            word-break: break-all;
            margin-top: 8px;
        }
        .player-access-code {
            font-family: monospace;
            font-weight: bold;
            letter-spacing: 0.05em;
        }
    </style>
</head>

<body>
    <div id="demoBanner" class="demo-banner" style="display:none;">DEMO VERSION</div>

    <a href="/" class="back-btn back-dashboard-btn" title="Back to Dashboard">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>

    <div class="container">
        <h1 id="pageHeader" class="text-center" style="margin-top:0;">Live Quiz</h1>

        <!-- ── Tab navigation ── -->
        <div class="lq-tab-nav">
            <button class="lq-tab-btn active" data-tab="scores" title="Self-paced individual sessions (either game type)">Single Sessions</button>
            <button class="lq-tab-btn" data-tab="teams" title="Team setups for live hosted rounds (Timed games)">Team Setups</button>
        </div>

        <div class="lq-tab-panel active" id="lq-tab-scores">

        <!-- Session list view -->
        <div id="sessionListView">
            <!-- Mobile sort accordion -->
            <div class="sort-section">
                <button class="sort-toggle-btn" id="sortToggleBtn" onclick="toggleSortBar()" title="Show or hide sort options">
                    <span>Sort by</span>
                    <svg class="filter-chevron" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div id="sl-sort-bar" class="sort-bar-container">
                    <span class="sort-bar-label">Sort:</span>
                    <button class="sort-bar-btn" id="mobileSortBtn-created_at" onclick="handleSort('created_at')">Started <span id="mobile-icon-created_at"></span></button>
                    <button class="sort-bar-btn" id="mobileSortBtn-name" onclick="handleSort('name')">Name <span id="mobile-icon-name"></span></button>
                    <button class="sort-bar-btn" id="mobileSortBtn-is_archived" onclick="handleSort('is_archived')">Status <span id="mobile-icon-is_archived"></span></button>
                </div>
            </div>

            <div class="table-wrapper" id="sessionsTableWrapper">
                <table id="sessionsTable">
                    <thead>
                        <tr>
                            <th class="sortable" onclick="handleSort('created_at')" style="width:120px;">
                                <div class="th-content">Started <span id="icon-created_at" class="sort-icon"></span></div>
                            </th>
                            <th class="sortable" onclick="handleSort('name')">
                                <div class="th-content">Session <span id="icon-name" class="sort-icon"></span></div>
                            </th>
                            <th class="sortable text-center" onclick="handleSort('is_archived')" style="width:100px;">
                                <div class="th-content" style="justify-content:center;">Status <span id="icon-is_archived" class="sort-icon"></span></div>
                            </th>
                            <th class="text-center" style="width:140px;">Progress</th>
                            <th class="text-center" style="width:200px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="sessionsTableBody"></tbody>
                </table>

                <div class="pagination-container" id="sessionsPaginationControls" style="display:none;">
                    <div class="page-limit-selector">
                        <label>Rows per page:</label>
                        <select id="sessionsRowsPerPage" onchange="changeLimit(this.value)"
                            style="padding:4px; border-radius:4px; border:1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-main);"
                            title="Number of sessions to display per page">
                            <option value="10">10</option>
                            <option value="25" selected>25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="all">All</option>
                        </select>
                    </div>
                    <div style="display:flex; align-items:center; gap:0;">
                        <button class="btn-page" id="sessionsBtnFirst" onclick="goToFirstPage()" title="First page" style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline><line x1="6" y1="6" x2="6" y2="18"></line></svg></button>
                        <button class="btn-page" id="sessionsBtnPrev" onclick="changePage(-1)" title="Previous page" style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                        <button id="sessionsPageInfo" class="btn-page" style="width:auto; min-width:52px; padding:0 8px; font-size:0.8em; cursor:default; pointer-events:none; white-space:nowrap; margin:0 1px;">1 of 1</button>
                        <button class="btn-page" id="sessionsBtnNext" onclick="changePage(1)" title="Next page" style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                        <button class="btn-page" id="sessionsBtnLast" onclick="goToLastPage()" title="Last page" style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline><line x1="18" y1="6" x2="18" y2="18"></line></svg></button>
                    </div>
                </div>
            </div>

            <!-- Mobile card list -->
            <div id="sessionsCardList">
                <div id="sessionsCardContainer"></div>
                <div class="pagination-container" id="sessionsPaginationControlsMobile" style="display:none;">
                    <div class="page-limit-selector">
                        <label>Rows per page:</label>
                        <select id="sessionsRowsPerPageMobile" onchange="changeLimit(this.value)"
                            style="padding:4px; border-radius:4px; border:1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-main);">
                            <option value="10">10</option>
                            <option value="25" selected>25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="all">All</option>
                        </select>
                    </div>
                    <div style="display:flex; align-items:center; gap:0;">
                        <button class="btn-page" id="sessionsBtnFirstMobile" onclick="goToFirstPage()" title="First page" style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline><line x1="6" y1="6" x2="6" y2="18"></line></svg></button>
                        <button class="btn-page" id="sessionsBtnPrevMobile" onclick="changePage(-1)" title="Previous page" style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                        <button id="sessionsPageInfoMobile" class="btn-page" style="width:auto; min-width:52px; padding:0 8px; font-size:0.8em; cursor:default; pointer-events:none; white-space:nowrap; margin:0 1px;">1 of 1</button>
                        <button class="btn-page" id="sessionsBtnNextMobile" onclick="changePage(1)" title="Next page" style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                        <button class="btn-page" id="sessionsBtnLastMobile" onclick="goToLastPage()" title="Last page" style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline><line x1="18" y1="6" x2="18" y2="18"></line></svg></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Session detail / results view -->
        <div id="sessionDetailView" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:15px;">
                <button onclick="backToSessionList()" class="btn-sm btn-secondary" style="margin:0;" title="Back to session list">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle; margin-right:4px;"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    Back to Sessions
                </button>
                <button onclick="refreshSessionDetail()" class="btn-sm btn-secondary" id="btnRefreshPlayers" style="margin:0;" title="Reload the player list to see the latest submissions">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle; margin-right:4px;"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    Refresh
                </button>
            </div>
            <h3 id="detailSessionName" style="margin-bottom:4px;"></h3>
            <p id="detailSummary" style="color:var(--text-muted); margin-top:0;"></p>

            <!-- Mobile sort accordion -->
            <div class="sort-section">
                <button class="sort-toggle-btn" id="playersSortToggleBtn" onclick="togglePlayersSortBar()" title="Show or hide sort options">
                    <span>Sort by</span>
                    <svg class="filter-chevron" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div id="players-sort-bar" class="sort-bar-container">
                    <span class="sort-bar-label">Sort:</span>
                    <button class="sort-bar-btn" id="mobilePlayerSortBtn-name" onclick="handlePlayerSort('name')">Member <span id="mobile-picon-name"></span></button>
                    <button class="sort-bar-btn" id="mobilePlayerSortBtn-status" onclick="handlePlayerSort('status')">Status <span id="mobile-picon-status"></span></button>
                    <button class="sort-bar-btn" id="mobilePlayerSortBtn-score" onclick="handlePlayerSort('score')">Score <span id="mobile-picon-score"></span></button>
                </div>
            </div>

            <div class="table-wrapper" id="playersTableWrapper">
                <table id="playersTable" style="width:100%;">
                    <thead>
                        <tr>
                            <th class="sortable" onclick="handlePlayerSort('name')"><div class="th-content">Member <span id="picon-name" class="sort-icon"></span></div></th>
                            <th class="sortable text-center" onclick="handlePlayerSort('status')" style="width:120px;"><div class="th-content" style="justify-content:center;">Status <span id="picon-status" class="sort-icon"></span></div></th>
                            <th class="sortable text-center" onclick="handlePlayerSort('score')" style="width:140px;"><div class="th-content" style="justify-content:center;">Score <span id="picon-score" class="sort-icon"></span></div></th>
                            <th class="text-center" style="width:160px;">Submitted At</th>
                            <th class="text-center" style="width:110px;">Code</th>
                            <th class="text-center" style="width:80px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="playersTableBody"></tbody>
                </table>

                <div class="pagination-container" id="playersPaginationControls" style="display:none;">
                    <div class="page-limit-selector">
                        <label>Rows per page:</label>
                        <select id="playersRowsPerPage" onchange="changePlayersLimit(this.value)"
                            style="padding:4px; border-radius:4px; border:1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-main);"
                            title="Number of players to display per page">
                            <option value="10">10</option>
                            <option value="25" selected>25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="all">All</option>
                        </select>
                    </div>
                    <div style="display:flex; align-items:center; gap:0;">
                        <button class="btn-page" id="playersBtnFirst" onclick="goToFirstPlayersPage()" title="First page" style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline><line x1="6" y1="6" x2="6" y2="18"></line></svg></button>
                        <button class="btn-page" id="playersBtnPrev" onclick="changePlayersPage(-1)" title="Previous page" style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                        <button id="playersPageInfo" class="btn-page" style="width:auto; min-width:52px; padding:0 8px; font-size:0.8em; cursor:default; pointer-events:none; white-space:nowrap; margin:0 1px;">1 of 1</button>
                        <button class="btn-page" id="playersBtnNext" onclick="changePlayersPage(1)" title="Next page" style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                        <button class="btn-page" id="playersBtnLast" onclick="goToLastPlayersPage()" title="Last page" style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline><line x1="18" y1="6" x2="18" y2="18"></line></svg></button>
                    </div>
                </div>
            </div>

            <!-- Mobile card list -->
            <div id="playersCardList">
                <div id="playersCardContainer"></div>
                <div class="pagination-container" id="playersPaginationControlsMobile" style="display:none;">
                    <div class="page-limit-selector">
                        <label>Rows per page:</label>
                        <select id="playersRowsPerPageMobile" onchange="changePlayersLimit(this.value)"
                            style="padding:4px; border-radius:4px; border:1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-main);">
                            <option value="10">10</option>
                            <option value="25" selected>25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="all">All</option>
                        </select>
                    </div>
                    <div style="display:flex; align-items:center; gap:0;">
                        <button class="btn-page" id="playersBtnFirstMobile" onclick="goToFirstPlayersPage()" title="First page" style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline><line x1="6" y1="6" x2="6" y2="18"></line></svg></button>
                        <button class="btn-page" id="playersBtnPrevMobile" onclick="changePlayersPage(-1)" title="Previous page" style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                        <button id="playersPageInfoMobile" class="btn-page" style="width:auto; min-width:52px; padding:0 8px; font-size:0.8em; cursor:default; pointer-events:none; white-space:nowrap; margin:0 1px;">1 of 1</button>
                        <button class="btn-page" id="playersBtnNextMobile" onclick="changePlayersPage(1)" title="Next page" style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                        <button class="btn-page" id="playersBtnLastMobile" onclick="goToLastPlayersPage()" title="Last page" style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline><line x1="18" y1="6" x2="18" y2="18"></line></svg></button>
                    </div>
                </div>
            </div>
        </div>

        </div>
        <!-- /lq-tab-scores -->

        <div class="lq-tab-panel" id="lq-tab-teams">

        <!-- Team session list view -->
        <div id="teamSessionListView">
            <!-- Mobile sort accordion -->
            <div class="sort-section">
                <button class="sort-toggle-btn" id="tsSortToggleBtn" onclick="toggleTeamSessionSortBar()" title="Show or hide sort options">
                    <span>Sort by</span>
                    <svg class="filter-chevron" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div id="tsl-sort-bar" class="sort-bar-container">
                    <span class="sort-bar-label">Sort:</span>
                    <button class="sort-bar-btn" id="tsMobileSortBtn-created_at" onclick="handleTeamSessionSort('created_at')">Started <span id="ts-mobile-icon-created_at"></span></button>
                    <button class="sort-bar-btn" id="tsMobileSortBtn-name" onclick="handleTeamSessionSort('name')">Name <span id="ts-mobile-icon-name"></span></button>
                    <button class="sort-bar-btn" id="tsMobileSortBtn-is_archived" onclick="handleTeamSessionSort('is_archived')">Status <span id="ts-mobile-icon-is_archived"></span></button>
                </div>
            </div>

            <div class="table-wrapper" id="teamSessionsTableWrapper">
                <table id="teamSessionsTable">
                    <thead>
                        <tr>
                            <th class="sortable" onclick="handleTeamSessionSort('created_at')" style="width:120px;">
                                <div class="th-content">Started <span id="ts-icon-created_at" class="sort-icon"></span></div>
                            </th>
                            <th class="sortable" onclick="handleTeamSessionSort('name')">
                                <div class="th-content">Session <span id="ts-icon-name" class="sort-icon"></span></div>
                            </th>
                            <th class="sortable text-center" onclick="handleTeamSessionSort('is_archived')" style="width:100px;">
                                <div class="th-content" style="justify-content:center;">Status <span id="ts-icon-is_archived" class="sort-icon"></span></div>
                            </th>
                            <th class="text-center" style="width:160px;">Teams / Members</th>
                            <th class="text-center" style="width:200px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="teamSessionsTableBody"></tbody>
                </table>

                <div class="pagination-container" id="teamSessionsPaginationControls" style="display:none;">
                    <div class="page-limit-selector">
                        <label>Rows per page:</label>
                        <select id="teamSessionsRowsPerPage" onchange="changeTeamSessionsLimit(this.value)"
