<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="resources/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#17A2B8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OpReady">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>Survey - OpReady</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .view-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: var(--bg-card);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }

        .preview-banner {
            background: #ffc107;
            color: #333;
            text-align: center;
            padding: 10px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 2px 5px var(--shadow);
        }

        .survey-header {
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .survey-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .survey-intro {
            font-size: 15px;
            color: var(--text-muted);
        }

        .question-card {
            background: var(--bg-body);
            padding: 20px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 15px;
        }

        .required-asterisk {
            color: var(--danger);
            margin-left: 4px;
        }

        .required-label {
            color: var(--danger);
            font-size: 13px;
            font-weight: 500;
            margin-left: 6px;
            white-space: nowrap;
        }

        .question-desc-wrapper p {
            margin-top: 0;
        }

        .question-desc-wrapper p:last-child {
            margin-bottom: 0;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            color: var(--text-main);
        }

        .text-response {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-main);
            min-height: 100px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .error-message {
            color: var(--danger);
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .completed-state {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }

        .completed-state svg {
            color: var(--success);
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
        }

        .app-branding-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .app-branding-header img {
            height: 40px;
            width: auto;
            object-fit: contain;
        }

        .app-branding-header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: bold;
            color: var(--text-main);
            text-align: center;
        }

        .survey-select {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-main);
        }
    </style>
</head>

<body>
    <div id="demoBanner" class="demo-banner" style="display:none;">DEMO VERSION</div>
    <div id="previewBanner" class="preview-banner" style="display:none;">PREVIEW MODE - Submissions are disabled</div>

    <div class="view-container">
        <div id="appBrandingHeader" class="app-branding-header" style="display: none;">
            <img id="brandingLogoLeft" src="" alt="App Logo Left">
            <h2 id="brandingTitle">Survey</h2>
            <img id="brandingLogoRight" src="" alt="App Logo Right">
        </div>

        <div id="completedState" class="completed-state">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <h2>Thank You!</h2>
            <p style="color: var(--text-muted); margin-top: 10px;" id="completedMessage">Your response has been securely
                recorded.</p>
        </div>

        <div id="surveyContent">
            <div class="survey-header">
                <h1 class="survey-title" id="surveyTitle">Loading Survey...</h1>
                <div class="survey-intro" id="surveyIntro"></div>
            </div>
            <div id="identityDisclosure"
                style="background-color: rgba(23, 162, 184, 0.1);display:none; margin-bottom: 20px; padding: 15px; border-radius: 8px; border: 1px solid var(--border-color);  transition: all 0.3s ease;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div id="disclosureIcon" style="font-size: 24px;"></div>
                    <div>
                        <h4 id="disclosureTitle" style="margin: 0; font-size: 1.1em;"></h4>
                        <p id="disclosureText" style="margin: 5px 0 0; font-size: 0.9em; color: var(--text-muted);">
                        </p>
                    </div>
                </div>
            </div>

            <form id="surveyForm" onsubmit="handleSubmission(event)">
                <div id="questionsContainer"></div>
                <button type="submit" class="btn-primary submit-btn" id="btnSubmit">Submit Response</button>
            </form>
        </div>
    </div>

    <button onclick="scrollToTop()" id="scrollTopBtn" title="Go to top">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
    </button>

    <script src="utils.js"></script>
    <script src="toast.js"></script>
    <script src="theme.js"></script>
    <script src="help.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const isPreview = urlParams.get('preview') === 'true';
        const publicId = urlParams.get('id');
        const accessCode = urlParams.get('code');
        const responseId = urlParams.get('responseId');
        const isReview = !!responseId;

        let surveyData = null;

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const configRes = await fetch('/ui-config');
                if (configRes.ok) {
                    uiConfig = await configRes.json();
                }
            } catch (e) {
                console.warn("Failed to load UI configuration payload", e);
            }

            const appName = uiConfig?.loginTitle || "OpReady";
            const appLogo = uiConfig?.appLogo || "resources/logo.png";
            const customTitle = `${appName} Survey`;

            document.title = customTitle;

            const brandingHeader = document.getElementById('appBrandingHeader');
            document.getElementById('brandingTitle').innerText = customTitle;

            if (appLogo) {
                document.getElementById('brandingLogoLeft').src = appLogo;
                document.getElementById('brandingLogoRight').src = appLogo;
                brandingHeader.style.display = 'flex';
            }

            if (uiConfig?.appBackground) {
                document.body.style.backgroundImage = `url('${uiConfig.appBackground}')`;
            }
            if (isReview) {
                const banner = document.getElementById('previewBanner');
                banner.style.display = 'block';
                banner.innerText = "REVIEW MODE - Viewing Submitted Answers";
                banner.style.backgroundColor = "var(--info)";
                document.body.style.paddingTop = '50px';
                document.getElementById('btnSubmit').style.display = 'none';

                await fetchSurveyData(`/api/surveys/responses/${responseId}`);
            } else if (isPreview) {
                const banner = document.getElementById('previewBanner');
                banner.style.display = 'block';
                document.body.style.paddingTop = '50px';
                if (!publicId) return showError("Preview requires a valid survey ID.");
                await fetchSurveyData(`/api/live-surveys/preview/${publicId}`);
            } else {
                if (!accessCode) return showError("Invalid or missing survey access code.");
                await fetchSurveyData(`/api/live-surveys/${accessCode}`);
            }
        });

        async function fetchSurveyData(endpoint) {
            try {
                const res = await fetch(endpoint);
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || "Failed to load survey.");

                // If the backend indicates it's already submitted
                if (data.status === 'submitted') {
                    showCompleted("You have already submitted this survey.");
                    return;
                }

                surveyData = data.survey;

                if (isReview) {
                    surveyData.answers = data.answers;
                    surveyData.respondentName = data.member_name;
                    // Review responses come from a non-anonymous context; set explicitly to avoid relying on template default
                    surveyData.is_anonymous = 0;
                } else if (data.respondentName) {
                    surveyData.respondentName = data.respondentName;
                    surveyData.is_anonymous = data.is_anonymous;
                }
                renderSurvey();
            } catch (err) {
                showError(err.message);
            }
        }

        function renderSurvey() {
            document.title = `${surveyData.name} - OpReady`;
            document.getElementById('surveyTitle').innerText = surveyData.name;
            document.getElementById('surveyIntro').innerHTML = surveyData.intro || "";

            const disclosure = document.getElementById("identityDisclosure");
            const title = document.getElementById("disclosureTitle");
            const text = document.getElementById("disclosureText");
            const icon = document.getElementById("disclosureIcon");

            if (disclosure) {
                disclosure.style.display = "block";
                if (surveyData.is_anonymous === 0) {
                    disclosure.style.borderLeft = "5px solid var(--danger)";
                    title.innerText = "Non-Anonymous Survey";
                    title.style.color = "var(--danger)";
                    disclosure.style.backgroundColor = "rgba(202, 27, 27, 0.301)";

                    text.innerHTML = `You are submitting this survey as <strong>${surveyData.respondentName}</strong>. Your identity and answers will be recorded.`;
                    icon.innerText = "🆔";
                } else {
                    disclosure.style.borderLeft = "5px solid var(--success)";
                    title.innerText = "Anonymous Survey";
                    title.style.color = "var(--success)";
                    text.innerText = "Your responses are private and will not be linked to your identity.";
                    icon.innerText = "🔒";
                }
            }

            // In review mode override the disclosure banner to reflect the reviewer context
            if (isReview && disclosure) {
                title.innerText = "Reviewing Response";
                text.innerHTML = `This response was submitted by <strong>${surveyData.respondentName}</strong>.`;
                disclosure.style.backgroundColor = "var(--bg-card)";
                disclosure.style.borderLeft = "5px solid var(--primary)";
            }

            const container = document.getElementById('questionsContainer');
            let structure = surveyData.structure;
            if (typeof structure === 'string') structure = JSON.parse(structure);
            const answers = isReview ? surveyData.answers : {};


            structure.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.setAttribute('data-id', q.id);
                card.setAttribute('data-required', q.required);

                let desc = (q.description || "").trim();
                const reqHtml = q.required ? `<span class="required-label">(required)</span>` : '';

                // Smart injection: puts the label inside the paragraph so it stays inline
                if (desc.endsWith('</p>')) {
                    desc = desc.substring(0, desc.length - 4) + reqHtml + '</p>';
                } else {
                    desc += reqHtml;
                }

                // Flex layout ensures the number stays aligned with the top of multiline paragraphs
                let html = `
                    <div class="question-text">
                        <div style="display:flex; align-items: flex-start; gap: 8px;">
                            <span style="min-width: 20px; margin-top: 1px;">${index + 1}.</span>
                            <div class="question-desc-wrapper" style="flex: 1;">${desc}</div>
                        </div>
                    </div>`;

                const applyReviewState = (input) => {
                    if (isReview) {
                        input.disabled = true;
                        const val = answers[q.id];
                        if (input.type === 'checkbox') {
                            if (Array.isArray(val) && val.includes(input.value)) input.checked = true;
                        } else if (input.type === 'radio') {
                            if (val === input.value) input.checked = true;
                        } else if (input.tagName === 'SELECT' || input.tagName === 'TEXTAREA') {
                            input.value = val || "";
                        }
                    }
                };
                if (q.type === 'text_multi') {
                    html += `<textarea name="${q.id}" class="text-response" placeholder="Enter your answer here..."></textarea>`;
                } else if (q.type === 'boolean') {

                    if (q.renderAs === 'dropdown') {
                        html += `<select name="${q.id}" class="survey-select">
                                    <option value="" disabled selected>Select an option...</option><option value="Yes">Yes</option><option value="No">No</option>`;
                        html += `</select>`;
                    } else {
                        html += `
                        <label class="option-label"><input type="radio" name="${q.id}" value="Yes"> Yes</label>
                        <label class="option-label"><input type="radio" name="${q.id}" value="No"> No</label>
                    `;
                    }


                } else if (q.type === 'radio') {
                    if (q.renderAs === 'dropdown') {
                        html += `<select name="${q.id}" class="survey-select">
                                    <option value="" disabled selected>Select an option...</option>`;
                        q.options.forEach(opt => html += `<option value="${opt}">${opt}</option>`);
                        html += `</select>`;
                    } else {
                        q.options.forEach(opt => {
                            html += `<label class="option-label"><input type="radio" name="${q.id}" value="${opt}"> ${opt}</label>`;
                        });
                    }
                } else if (q.type === 'checkboxes') {
                    q.options.forEach(opt => {
                        html += `<label class="option-label"><input type="checkbox" name="${q.id}" value="${opt}"> ${opt}</label>`;
                    });
                }

                html += `<div class="error-message" id="err_${q.id}">This field is required.</div>`;
                card.innerHTML = html;

                if (isReview) {
                    card.querySelectorAll('input, textarea, select').forEach(input => {
                        input.disabled = true;
                        const val = answers[q.id];

                        if (input.type === 'checkbox') {
                            if (Array.isArray(val) && val.includes(input.value)) input.checked = true;
                        } else if (input.type === 'radio') {
                            if (val === input.value) input.checked = true;
                        } else if (input.tagName === 'SELECT' || input.tagName === 'TEXTAREA') {
                            input.value = val || "";
                        }
                    });
                }

                container.appendChild(card);
            });
        }

        async function handleSubmission(e) {
            e.preventDefault();

            if (isPreview) {
                showToast("Submission bypassed in Preview Mode.", "warning");
                return;
            }

            let isValid = true;
            const answers = {};
            const cards = document.querySelectorAll('.question-card');

            cards.forEach(card => {
                const id = card.getAttribute('data-id');
                const isReq = card.getAttribute('data-required') === 'true';
                const errDiv = document.getElementById(`err_${id}`);
                errDiv.style.display = 'none';

                let val = null;
                const inputs = card.querySelectorAll(`input[name="${id}"], textarea[name="${id}"], select[name="${id}"]`);

                if (inputs[0].type === 'checkbox') {
                    val = Array.from(inputs).filter(i => i.checked).map(i => i.value);
                    if (val.length === 0) val = null;
                } else if (inputs[0].type === 'radio') {
                    const checked = Array.from(inputs).find(i => i.checked);
                    if (checked) val = checked.value;
                } else {
                    val = inputs[0].value.trim();
                    if (val === "") val = null;
                }

                if (isReq && !val) {
                    isValid = false;
                    errDiv.style.display = 'block';
                }

                answers[id] = val;
            });

            if (!isValid) {
                showToast("Please complete all required fields.", "error");
                document.querySelector('.error-message[style*="display: block"]').scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = "Submitting...";

            try {
                const res = await fetch(`/api/live-surveys/${accessCode}/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ answers })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || "Submission failed.");

                showCompleted("Your response has been securely recorded.");
            } catch (err) {
                showToast(err.message, "error");
                btn.disabled = false;
                btn.innerText = "Submit Response";
            }
        }

        function showCompleted(msg) {
            document.getElementById('surveyContent').style.display = 'none';
            document.getElementById('completedState').style.display = 'block';
            document.getElementById('completedMessage').innerText = msg;
        }

        function showError(msg) {
            document.getElementById('surveyContent').innerHTML = `
                <div style="text-align:center; padding: 40px 20px;">
                    <svg style="color:var(--danger); width:64px; height:64px; margin-bottom:20px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <h2>Survey Unavailable</h2>
                    <p style="color:var(--text-muted);">${msg}</p>
                </div>
            `;
        }

        const scrollTopBtn = document.getElementById("scrollTopBtn");
        window.onscroll = function () { if (scrollTopBtn) scrollTopBtn.style.display = (window.scrollY > 200) ? "flex" : "none"; };
        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    </script>
    <script src="/js/pwa.js"></script>

</body>

</html>
