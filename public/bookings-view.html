<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Served at /booking/<slug>: every asset path must be absolute -->
    <link rel="icon" type="image/x-icon" href="/resources/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#17A2B8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OpReady">
    <meta name="robots" content="noindex, nofollow">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>Book a Slot</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .bv-wrap { max-width: 760px; margin: 24px auto; padding: 0 12px 60px; }
        .bv-card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px;
            box-shadow: 0 2px 6px var(--shadow); padding: 18px 20px; margin-bottom: 16px;
        }
        .bv-brand { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom: 14px; color: var(--text-main); }
        .bv-brand img { height: 40px; width: auto; }
        .bv-brand span { font-weight: 700; font-size: 1.1em; }
        .bv-title { margin: 0 0 6px; font-size: 1.5em; color: var(--text-main); }
        .bv-meta { display:flex; flex-wrap:wrap; gap: 6px 18px; color: var(--text-muted); font-size: 0.92em; margin-bottom: 6px; }
        .bv-meta strong { color: var(--text-main); }
        .bv-description { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border-color); color: var(--text-main); }
        .bv-note { font-size: 0.85em; color: var(--text-muted); margin-top: 8px; }
        .bv-notice { border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; border: 1px solid var(--border-color); border-left-width: 5px; background: var(--bg-card); color: var(--text-main); }
        .bv-notice.warn { border-left-color: var(--warning); }
        .bv-notice.ok { border-left-color: var(--success); }
        .bv-notice.error { border-left-color: var(--danger); }
        .bv-h2 { margin: 0 0 10px; font-size: 1.15em; color: var(--text-main); }

        .bv-select { width: 100%; padding: 10px 12px; font-size: 1em; border: 1px solid var(--border-color); border-radius: 6px; background: var(--input-bg); color: var(--text-main); }

        .bv-mine { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding: 8px 0; }
        .bv-mine + .bv-mine { border-top: 1px solid var(--border-color); }
        .bv-mine.changing .bv-mine-when { color: var(--primary); }
        .bv-mine-when { font-size: 1.15em; font-weight: 700; color: var(--text-main); }
        .bv-mine-actions { display:flex; gap:8px; flex-wrap:wrap; }

        .bv-day { margin-bottom: 18px; }
        .bv-day-title { font-weight: 700; color: var(--text-main); margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border-color); }
        .bv-slots { display:grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
        .bv-slot {
            display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left;
            padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-body); color: var(--text-main); cursor: pointer; min-height: 56px;
            font-size: 0.95em; margin: 0; box-shadow: none;
        }
        .bv-slot:hover:not(:disabled) { border-color: var(--primary); }
        /* Non-interactive slots stay readable; only full/started/unavailable ones are dimmed */
        .bv-slot:disabled { cursor: default; }
        .bv-slot.unavail { opacity: 0.5; cursor: not-allowed; }
        .bv-slot.selected { border: 2px solid var(--primary); background: var(--bg-hover); }
        .bv-slot.mine { border: 2px solid var(--success); }
        .bv-slot-time { font-weight: 700; }
        .bv-slot-info { font-size: 0.78em; color: var(--text-muted); }
        .bv-slot.mine .bv-slot-info { color: var(--success); font-weight: 600; }
        .bv-slot-names { font-size: 0.75em; color: var(--text-muted); line-height: 1.25; }

        .bv-field { margin-bottom: 12px; }
        .bv-field label { display:block; font-weight: 600; margin-bottom: 4px; color: var(--text-main); }
        .bv-field input, .bv-field textarea {
            width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 1em;
            border: 1px solid var(--border-color); border-radius: 6px; background: var(--input-bg); color: var(--text-main);
        }
        .bv-req { color: var(--danger); }
        .bv-form-actions { display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top: 6px; }
        .bv-form-actions button { min-height: 42px; }
        .bv-loading { text-align:center; color: var(--text-muted); padding: 40px 0; }

        @media (max-width: 480px) {
            .bv-wrap { margin-top: 12px; }
            .bv-card { padding: 14px; }
            .bv-title { font-size: 1.3em; }
            .bv-slots { grid-template-columns: repeat(2, 1fr); }
            .bv-form-actions button, .bv-mine-actions button { flex: 1 1 auto; }
        }
    </style>
</head>

<body>
    <div class="bv-wrap">
        <div class="bv-brand" id="brand" style="display:none;">
            <img id="brandLogo" alt="" src="/resources/logo.png">
            <span id="brandName"></span>
        </div>

        <div id="loading" class="bv-loading">Loading booking page…</div>
        <div id="errorBox" class="bv-notice error" style="display:none;"></div>

        <div id="content" style="display:none;">
            <div class="bv-card">
                <h1 class="bv-title" id="evName"></h1>
                <div class="bv-meta" id="evMeta"></div>
                <div class="bv-description" id="evDescription" style="display:none;"></div>
                <div class="bv-note" id="tzNote"></div>
            </div>

            <div id="statusNotice" class="bv-notice" style="display:none;"></div>

            <!-- General links: pick your name -->
            <div class="bv-card" id="whoCard" style="display:none;">
                <h2 class="bv-h2">Who are you?</h2>
                <select id="whoSelect" class="bv-select" title="Choose your name from the list"></select>
                <div class="bv-note">Pick your own name — the booking is recorded against it.</div>
            </div>

            <!-- Personal links: identified automatically -->
            <div class="bv-card" id="meCard" style="display:none;">
                <div class="bv-meta" style="margin:0;">Booking for <strong id="meName"></strong></div>
            </div>

            <div class="bv-card" id="myBookingCard" style="display:none;">
                <h2 class="bv-h2" id="myBookingTitle">Your appointment</h2>
                <div id="myBookingList"></div>
                <div class="bv-note" id="myBookingNote"></div>
            </div>

            <div class="bv-card" id="slotsCard">
                <h2 class="bv-h2" id="slotsTitle">Choose a slot</h2>
                <div id="slotsHint" class="bv-note" style="margin:-4px 0 12px;"></div>
                <div id="slotsList"></div>
            </div>

            <div class="bv-card" id="formCard" style="display:none;">
                <h2 class="bv-h2" id="formTitle">Confirm your booking</h2>
                <div class="bv-meta" style="margin-bottom:12px;">Slot: <strong id="formSlot"></strong></div>
                <div id="formFields"></div>
                <div class="bv-form-actions">
                    <button class="btn-secondary" onclick="clearSelection()" title="Close without booking">Cancel</button>
                    <button class="btn-success" id="btnBook" onclick="submitBooking()" title="Book the selected slot">Book this slot</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/utils.js"></script>
    <script src="/toast.js"></script>
    <script src="/theme.js"></script>
    <script src="/help.js"></script>
    <script src="/js/bookings-view.js"></script>
</body>

</html>
