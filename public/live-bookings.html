<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="resources/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#17A2B8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OpReady">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title id="pageTitle">Booking Events - OpReady</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="/sidebar.css">
    <style>
        .bk-status { display:inline-block; padding:3px 8px; border-radius:4px; font-size:11px; font-weight:bold; text-transform:uppercase; letter-spacing:0.5px; color:#fff; white-space:nowrap; }
        .bk-status.open { background: var(--success); }
        .bk-status.locked { background: var(--warning); color: #212529; }
        .bk-status.disabled { background: var(--danger); }
        .bk-status.archived { background: var(--text-muted); }
        .access-badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:0.75em; font-weight:600; color:#fff; margin-left:6px; }
        .access-badge.general { background: var(--info); }
        .access-badge.personal { background: var(--primary); }
        .progress-cell { display:flex; align-items:center; gap:10px; min-width:160px; }
        .progress-bar { flex:1; height:8px; background: var(--border-color); border-radius:4px; overflow:hidden; }
        .progress-fill { height:100%; background: var(--success); }
        .bk-muted { color: var(--text-muted); font-size: 0.85em; }
        .bk-actions { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }

        .toolbar-btn-mobile { display: none; }
        @media (max-width: 768px) {
            .toolbar-btn-desktop { display: none; }
            .toolbar-btn-mobile {
                display: inline-flex; align-items: center; justify-content: center;
                width: 36px; height: 36px; padding: 0; border-radius: 6px;
            }
            .filter-bar {
                display: none; flex-direction: column; gap: 6px; padding: 8px 10px;
                background: var(--bg-card); border: 1px solid var(--border-color);
                border-radius: 8px; margin-bottom: 10px;
            }
            .filter-bar.filter-expanded { display: flex; }
            .filter-bar .filter-group {
                flex: 0 0 auto !important; flex-direction: row !important; align-items: center;
                gap: 8px; min-width: unset; width: 100%;
            }
            .filter-bar .filter-group > label { min-width: 8em; font-size: 12px; flex-shrink: 0; white-space: nowrap; }
            .filter-bar .filter-group > input,
            .filter-bar .filter-group > select,
            .filter-bar .filter-group > div { flex: 1; min-width: 0; }
            .filter-bar .filter-group-date { flex-direction: column !important; align-items: stretch !important; gap: 4px; }
            .filter-bar .filter-group-date > label { min-width: unset; }
            .filter-bar .date-range-container { flex-direction: row !important; align-items: center; gap: 6px; width: 100%; }
            .filter-bar .date-range-container .filter-date { width: auto !important; flex: 1 !important; min-width: 0; }
            .filter-bar .filter-actions { flex-direction: row; justify-content: flex-end; gap: 8px; }
        }
    </style>
</head>

<body>
    <div id="demoBanner" class="demo-banner" style="display:none;">DEMO VERSION</div>

    <a href="/" class="back-btn back-dashboard-btn" title="Back to Dashboard">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>

    <div class="container">
        <h1 id="pageHeader" class="text-center" style="margin-top:0;">Booking Events</h1>

        <div style="display:flex; gap:8px; justify-content:flex-end; align-items:center; margin-bottom:10px;">
            <button onclick="window.location.href='bookings-manage.html'" class="btn-sm btn-primary toolbar-btn-desktop"
                title="Open the booking templates to create or publish an event">Open Templates</button>
            <button onclick="window.location.href='bookings-manage.html'" class="btn-primary toolbar-btn-mobile"
                title="Open the booking templates to create or publish an event">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <button onclick="loadData()" class="btn-sm btn-primary toolbar-btn-desktop" title="Reload the list of booking events">Refresh</button>
            <button onclick="loadData()" class="btn-primary toolbar-btn-mobile" title="Reload the list of booking events">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
            </button>
        </div>

        <!-- Filter section: accordion on mobile, always visible on desktop -->
        <div class="filter-section">
            <button class="filter-toggle-btn" id="filterToggleBtn" onclick="toggleFilters()" title="Show or hide filters">
                <span style="display:flex; align-items:center; gap:8px;">
                    Filters
                    <span id="filterActiveCount" style="display:none; background:var(--primary); color:#fff; border-radius:10px; padding:1px 8px; font-size:0.78em; font-weight:700;"></span>
                </span>
                <svg class="filter-chevron" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>

            <div class="filter-bar" id="filterBar">
                <div class="filter-group" style="flex: 1; min-width: 200px;">
                    <label>Event Name</label>
                    <input type="text" id="filterName" placeholder="Contains..." title="Filter by event name (partial match)" oninput="applyFilters()">
                </div>
                <div class="filter-group">
                    <label>Status</label>
                    <select id="filterStatus" style="width: 140px;" title="Filter by event status" onchange="applyFilters()">
                        <option value="current" selected>Not archived</option>
                        <option value="open">Open</option>
                        <option value="locked">Locked</option>
                        <option value="disabled">Disabled</option>
                        <option value="archived">Archived</option>
                        <option value="all">All</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Access</label>
                    <select id="filterAccess" style="width: 130px;" title="Filter by link type" onchange="applyFilters()">
                        <option value="all" selected>All</option>
                        <option value="personal">Personal links</option>
                        <option value="general">General link</option>
                    </select>
                </div>
                <div class="filter-group filter-group-date">
                    <label>Event Dates Between</label>
                    <div class="date-range-container">
                        <input type="date" id="filterDateFrom" class="filter-date" title="Events running on or after this date" onchange="applyFilters()">
                        <input type="date" id="filterDateTo" class="filter-date" title="Events running on or before this date" onchange="applyFilters()">
                    </div>
                </div>
                <div class="filter-group filter-actions" style="flex-direction: row; gap: 10px; align-items: flex-end;">
                    <button onclick="resetFilters()" class="btn-sm btn-secondary" title="Clear all filters">Reset</button>
                </div>
            </div>
        </div>

        <div id="eventsTable"></div>
    </div>

    <button onclick="scrollToTop()" id="scrollTopBtn" title="Go to top">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
    </button>

    <script src="utils.js"></script>
    <script src="datepicker.js"></script>
    <script src="toast.js"></script>
    <script src="theme.js"></script>
    <script src="help.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="js/booking-table.js"></script>
    <script src="js/live-bookings.js"></script>
    <script>
        const scrollTopBtn = document.getElementById("scrollTopBtn");
        window.onscroll = function () { if (scrollTopBtn) scrollTopBtn.style.display = (window.scrollY > 200) ? "flex" : "none"; };
        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    </script>
    <script src="/js/pwa.js"></script>
</body>

</html>
