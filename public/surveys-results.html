<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="resources/favicon.ico">
    <title id="pageTitle">Survey Results - OpReady</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="/sidebar.css">
    <style>
        /* Card & Layout */
        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .result-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        /* Bar Chart Styles */
        .bar-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .bar-label {
            width: 40%;
            font-size: 14px;
            color: var(--text-muted);
            padding-right: 15px;
            text-align: right;
        }

        .bar-track {
            width: 50%;
            background: var(--input-bg);
            border-radius: 4px;
            height: 20px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            background: var(--success);
            height: 100%;
            transition: width 0.5s ease;
            border-radius: 4px;
        }

        .bar-percent {
            width: 10%;
            font-size: 13px;
            font-weight: bold;
            text-align: left;
            padding-left: 10px;
            color: var(--text-main);
        }

        /* Text Response Styles */
        .text-response {
            background: var(--input-bg);
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 14px;
            border-left: 3px solid var(--success);
            color: var(--text-main);
        }

        /* Banner */
        .summary-banner {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-banner h2 {
            margin: 0;
            font-size: 18px;
            color: var(--primary-color);
        }

        /* Sliding Badge Component */
        .sliding-badge-container {
            position: relative;
            width: 180px;
            /* Adjusted for Summary/Detailed text width */
            height: 34px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            overflow: hidden;
        }

        .sliding-badge {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            align-items: center;
            cursor: pointer;
        }

        .badge-label {
            flex: 1;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            z-index: 2;
            transition: color 0.3s ease;
            color: var(--text-muted);
        }

        .badge-slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: calc(50% - 2px);
            height: calc(100% - 4px);
            background: var(--primary);
            border-radius: 18px;
            z-index: 1;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Toggle Logic */
        #resultsViewToggle:checked+.sliding-badge .badge-slider {
            transform: translateX(100%);
        }

        #resultsViewToggle:not(:checked)+.sliding-badge .active-label {
            color: #fff;
        }

        #resultsViewToggle:checked+.sliding-badge .archived-label {
            color: #fff;
        }

        @media print {
            .sidebar,
            #sidebar {
                display: none !important;
            }

            body,
            .container {
                margin-left: 0 !important;
                padding-left: 0 !important;
                max-width: 100% !important;
            }

            #exportActionButtons,
            .back-dashboard-btn,
            #scrollTopBtn,
            .help-floating-btn,
            #demoBanner {
                display: none !important;
            }

            body {
                background: #fff !important;
            }

            .container {
                margin: 0 !important;
                box-shadow: none !important;
            }

            .result-card {
                /* Prevent individual questions from being split across two pages */
                page-break-inside: avoid;
                break-inside: avoid;
                border: 1px solid #ccc !important;
                box-shadow: none !important;
                background: #fff !important;
            }

            /* Optional: ensure bar chart colors print accurately (requires browser support) */
            .bar-fill {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>

<body>
    <div id="demoBanner" class="demo-banner" style="display:none;">DEMO VERSION</div>

    <a href="live-surveys.html" class="back-btn back-dashboard-btn" title="Back to Live Surveys">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>

    <div class="container">
        <h1 id="pageHeader" class="text-center" style="margin-top:0;">Survey Results</h1>

        <div class="summary-banner">
            <div>
                <h2 id="surveyTitle" style="margin-bottom: 5px;">Loading Results...</h2>
                <div style="font-size: 16px; font-weight: bold;">
                    Total Submissions: <span id="totalSubmissions">0</span>
                </div>
            </div>
            <div id="viewToggleContainer" style="display:none; margin-right: 15px;">
                <div class="sliding-badge-container">
                    <input type="checkbox" id="resultsViewToggle" onchange="toggleResultsView()" style="display:none;">
                    <label for="resultsViewToggle" class="sliding-badge">
                        <span class="badge-label active-label">Summary</span>
                        <span class="badge-label archived-label">Detailed</span>
                        <div class="badge-slider"></div>
                    </label>
                </div>
            </div>
        </div>
        <div id="detailedResultsContainer" style="display:none; margin-top: 20px;">
            <div class="result-card" style="padding:0; overflow-x:auto;">
                <table class="data-table" id="detailedResponsesTable" style="width:100%; border:none; margin:0;">
                    <thead>
                        <tr>
                            <th onclick="sortDetailedTable('name')" style="cursor:pointer;">Firefighter <span
                                    id="sort_name"></span></th>
                            <th onclick="sortDetailedTable('date')" style="cursor:pointer;">Submitted <span
                                    id="sort_date"></span></th>
                            <th style="text-align:center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="detailedTableBody"></tbody>
                </table>
            </div>
        </div>
        <div id="resultsContainer">
        </div>
        <div id="exportActionButtons" class="tools-bar" style="margin-top: 30px; justify-content: flex-end;">
            <div style="display:flex; gap:10px;">
                <button onclick="window.print()" class="btn-sm btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" style="vertical-align:middle; margin-right:5px;">
                        <polyline points="6 9 6 2 18 2 18 9"></polyline>
                        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                        <rect x="6" y="14" width="12" height="8"></rect>
                    </svg> Print
                </button>
                <button onclick="exportCSV()" class="btn-sm btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" style="vertical-align:middle; margin-right:5px;">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg> Export CSV
                </button>
                <button onclick="exportPDF()" class="btn-sm btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" style="vertical-align:middle; margin-right:5px;">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg> Export PDF
                </button>
            </div>
        </div>
    </div>


    <div id="toastContainer" class="toast-container"></div>

    <button onclick="scrollToTop()" id="scrollTopBtn" title="Go to top">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
    </button>
    <button onclick="openModal('helpModal')" class="help-floating-btn" title="Help">?</button>
    <script src="/socket.io/socket.io.js"></script>
    <script src="utils.js"></script>

    <script src="toast.js"></script>
    <script src="theme.js"></script>
    <script src="help.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="js/surveys-results.js"></script>
    <script>
        fetch('/ui-config').then(r => r.json()).then(c => {
            if (c.loginTitle) {
                document.title = "Survey Results - " + c.loginTitle;
                document.getElementById('pageHeader').innerText = "Survey Results - " + c.loginTitle;
            }
            if (c.appBackground) document.body.style.backgroundImage = `url('${c.appBackground}')`;
            if (c.appMode === 'demo') document.getElementById('demoBanner').style.display = 'block';
        });
    </script>
</body>

</html>
