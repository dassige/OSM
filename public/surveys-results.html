<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="resources/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#17A2B8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OpReady">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title id="pageTitle">Survey Results - OpReady</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="/sidebar.css">
    <style>
        /* ── Result cards ── */
        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .result-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        /* ── Bar chart ── */
        .bar-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .bar-label {
            width: 40%;
            font-size: 14px;
            color: var(--text-muted);
            padding-right: 15px;
            text-align: right;
            word-break: break-word;
        }

        .bar-track {
            width: 50%;
            background: var(--input-bg);
            border-radius: 4px;
            height: 20px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            background: var(--success);
            height: 100%;
            transition: width 0.5s ease;
            border-radius: 4px;
        }

        .bar-percent {
            width: 10%;
            font-size: 13px;
            font-weight: bold;
            text-align: left;
            padding-left: 10px;
            color: var(--text-main);
        }

        /* ── Text responses ── */
        .text-response {
            background: var(--input-bg);
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 14px;
            border-left: 3px solid var(--success);
            color: var(--text-main);
        }

        /* ── Summary banner ── */
        .summary-banner {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-banner h2 {
            margin: 0;
            font-size: 18px;
            color: var(--primary-color);
        }

        /* ── Sliding badge toggle ── */
        .sliding-badge-container {
            position: relative;
            width: 180px;
            height: 34px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            overflow: hidden;
        }

        .sliding-badge {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            align-items: center;
            cursor: pointer;
        }

        .badge-label {
            flex: 1;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            z-index: 2;
            transition: color 0.3s ease;
            color: var(--text-muted);
        }

        .badge-slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: calc(50% - 2px);
            height: calc(100% - 4px);
            background: var(--primary);
            border-radius: 18px;
            z-index: 1;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #resultsViewToggle:checked + .sliding-badge .badge-slider {
            transform: translateX(100%);
        }

        #resultsViewToggle:not(:checked) + .sliding-badge .active-label {
            color: #fff;
        }

        #resultsViewToggle:checked + .sliding-badge .archived-label {
            color: #fff;
        }

        /* ── Detailed view: card list hidden on desktop ── */
        #detailedCardList { display: none; }

        /* ── Mobile overrides ── */
        @media (max-width: 768px) {
            /* Summary banner: stack vertically */
            .summary-banner {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            #viewToggleContainer {
                margin-right: 0 !important;
                align-self: flex-end;
            }

            /* Bar chart: tighten widths so labels don't clip */
            .bar-label {
                width: 35%;
                font-size: 12px;
                padding-right: 8px;
            }

            .bar-track {
                width: 48%;
            }

            .bar-percent {
                width: 17%;
                font-size: 12px;
                padding-left: 6px;
            }

            /* Detailed table hidden; cards shown */
            #detailedTableWrapper { display: none; }
            #detailedCardList      { display: block; }
        }

        @media print {
            .sidebar,
            #sidebar {
                display: none !important;
            }

            body,
            .container {
                margin-left: 0 !important;
                padding-left: 0 !important;
                max-width: 100% !important;
            }

            #exportActionButtons,
            .back-dashboard-btn,
            #scrollTopBtn,
            .help-floating-btn,
            #demoBanner {
                display: none !important;
            }

            body {
                background: #fff !important;
            }

            .container {
                margin: 0 !important;
                box-shadow: none !important;
            }

            .result-card {
                page-break-inside: avoid;
                break-inside: avoid;
                border: 1px solid #ccc !important;
                box-shadow: none !important;
                background: #fff !important;
            }

            .bar-fill {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>

<body>
    <div id="demoBanner" class="demo-banner" style="display:none;">DEMO VERSION</div>

    <a href="live-surveys.html" class="back-btn back-dashboard-btn" title="Back to Live Surveys">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>

    <div class="container">
        <h1 id="pageHeader" class="text-center" style="margin-top:0;">Survey Results</h1>

        <!-- Summary banner: survey name + submission count + view toggle -->
        <div class="summary-banner">
            <div>
                <h2 id="surveyTitle" style="margin-bottom: 5px;">Loading Results...</h2>
                <div style="font-size: 16px; font-weight: bold;">
                    Total Submissions: <span id="totalSubmissions">0</span>
                </div>
            </div>
            <div id="viewToggleContainer" style="display:none; margin-right: 15px;">
                <div class="sliding-badge-container"
                    title="Switch between summary charts and individual responses">
                    <input type="checkbox" id="resultsViewToggle" onchange="toggleResultsView()"
                        style="display:none;">
                    <label for="resultsViewToggle" class="sliding-badge">
                        <span class="badge-label active-label">Summary</span>
                        <span class="badge-label archived-label">Detailed</span>
                        <div class="badge-slider"></div>
                    </label>
                </div>
            </div>
        </div>

        <!-- Detailed view: per-respondent table + mobile cards -->
        <div id="detailedResultsContainer" style="display:none; margin-top: 20px;">

            <!-- Desktop table -->
            <div class="table-wrapper" id="detailedTableWrapper">
                <table class="data-table" id="detailedResponsesTable"
                    style="width:100%; border:none; margin:0;">
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="name" onclick="sortDetailedTable('name')">
                                Firefighter <span id="icon-name" class="sort-icon">⇅</span>
                            </th>
                            <th class="sortable" data-sort="date" onclick="sortDetailedTable('date')"
                                style="width:200px;">
                                Submitted <span id="icon-date" class="sort-icon">⇅</span>
                            </th>
                            <th style="text-align:center; width:140px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="detailedTableBody"></tbody>
                </table>

                <div class="pagination-container" id="detailedPaginationControls" style="display:none;">
                    <div class="page-limit-selector">
                        <label>Rows per page:</label>
                        <select id="detailedRowsPerPage" onchange="changeDetailedLimit(this.value)"
                            style="padding:4px; border-radius:4px; border:1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-main);"
                            title="Number of rows to display per page">
                            <option value="10">10</option>
                            <option value="25" selected>25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="all">All</option>
                        </select>
                    </div>
                    <div style="display:flex; align-items:center; gap:0;">
                        <button class="btn-page" id="detailedBtnFirst" onclick="goToDetailedFirstPage()"
                            title="First page" style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg"
                                width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="15 18 9 12 15 6"></polyline>
                                <line x1="6" y1="6" x2="6" y2="18"></line>
                            </svg></button>
                        <button class="btn-page" id="detailedBtnPrev" onclick="changeDetailedPage(-1)"
                            title="Previous page" style="margin:0 1px;"><svg
                                xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                                stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg></button>
                        <button id="detailedPageInfo" class="btn-page"
                            style="width:auto; min-width:52px; padding:0 8px; font-size:0.8em; cursor:default; pointer-events:none; white-space:nowrap; margin:0 1px;">1
                            of 1</button>
                        <button class="btn-page" id="detailedBtnNext" onclick="changeDetailedPage(1)"
                            title="Next page" style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg"
                                width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg></button>
                        <button class="btn-page" id="detailedBtnLast" onclick="goToDetailedLastPage()"
                            title="Last page" style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg"
                                width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                                <line x1="18" y1="6" x2="18" y2="18"></line>
                            </svg></button>
                    </div>
                </div>
            </div>

            <!-- Mobile card list for detailed view -->
            <div id="detailedCardList">
                <div id="detailedCardContainer"></div>
                <div class="pagination-container" id="detailedPaginationControlsMobile"
                    style="display:none;">
                    <div class="page-limit-selector">
                        <label>Rows per page:</label>
                        <select id="detailedRowsPerPageMobile" onchange="changeDetailedLimit(this.value)"
                            style="padding:4px; border-radius:4px; border:1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-main);"
                            title="Number of rows to display per page">
                            <option value="10">10</option>
                            <option value="25" selected>25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="all">All</option>
                        </select>
                    </div>
                    <div style="display:flex; align-items:center; gap:0;">
                        <button class="btn-page" id="detailedBtnFirstMobile"
                            onclick="goToDetailedFirstPage()" title="First page"
                            style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg" width="16"
                                height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="15 18 9 12 15 6"></polyline>
                                <line x1="6" y1="6" x2="6" y2="18"></line>
                            </svg></button>
                        <button class="btn-page" id="detailedBtnPrevMobile"
                            onclick="changeDetailedPage(-1)" title="Previous page"
                            style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg" width="16"
                                height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg></button>
                        <button id="detailedPageInfoMobile" class="btn-page"
                            style="width:auto; min-width:52px; padding:0 8px; font-size:0.8em; cursor:default; pointer-events:none; white-space:nowrap; margin:0 1px;">1
                            of 1</button>
                        <button class="btn-page" id="detailedBtnNextMobile"
                            onclick="changeDetailedPage(1)" title="Next page"
                            style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg" width="16"
                                height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg></button>
                        <button class="btn-page" id="detailedBtnLastMobile"
                            onclick="goToDetailedLastPage()" title="Last page"
                            style="margin:0 1px;"><svg xmlns="http://www.w3.org/2000/svg" width="16"
                                height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                                <line x1="18" y1="6" x2="18" y2="18"></line>
                            </svg></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Summary view: per-question charts -->
        <div id="resultsContainer"></div>

        <!-- Export actions -->
        <div id="exportActionButtons" class="tools-bar" style="margin-top: 30px; justify-content: flex-end;">
            <div style="display:flex; gap:10px;">
                <button onclick="window.print()" class="btn-sm btn-primary"
                    title="Print survey results">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        style="vertical-align:middle; margin-right:5px;">
                        <polyline points="6 9 6 2 18 2 18 9"></polyline>
                        <path
                            d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2">
                        </path>
                        <rect x="6" y="14" width="12" height="8"></rect>
                    </svg> Print
                </button>
                <button onclick="exportCSV()" class="btn-sm btn-primary"
                    title="Export all responses to a CSV file">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        style="vertical-align:middle; margin-right:5px;">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg> Export CSV
                </button>
                <button onclick="exportPDF()" class="btn-sm btn-primary"
                    title="Export survey results as a PDF document">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        style="vertical-align:middle; margin-right:5px;">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg> Export PDF
                </button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <button onclick="scrollToTop()" id="scrollTopBtn" title="Go to top">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
    </button>
    <button onclick="openModal('helpModal')" class="help-floating-btn" title="Help">?</button>

    <script src="/socket.io/socket.io.js"></script>
    <script src="utils.js"></script>
    <script src="toast.js"></script>
    <script src="theme.js"></script>
    <script src="help.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="js/surveys-results.js"></script>
    <script src="/js/pwa.js"></script>

</body>

</html>
