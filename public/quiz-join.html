<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="resources/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#17A2B8">
    <title id="pageTitle">Join a Quiz - OpReady</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: var(--bg-body);
            padding-top: 20px;
        }

        .join-container {
            max-width: 420px;
            margin: 60px auto 0 auto;
            background: var(--bg-card);
            padding: 36px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px var(--shadow);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .join-title {
            margin: 0 0 6px 0;
            color: var(--primary);
        }

        .join-subtitle {
            color: var(--text-muted);
            margin: 0 0 26px 0;
        }

        #joinCodeInput {
            width: 100%;
            box-sizing: border-box;
            font-size: 2em;
            font-weight: bold;
            letter-spacing: 0.25em;
            text-align: center;
            text-transform: uppercase;
            padding: 14px 10px;
            border-radius: 6px;
            border: 2px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-main);
        }

        #joinCodeInput:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-join {
            display: block;
            width: 100%;
            margin-top: 18px;
            background: var(--success);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 4px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-join:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #joinError {
            color: var(--danger);
            margin-top: 16px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="join-container">
            <h1 class="join-title">Join a Quiz</h1>
            <p class="join-subtitle">Enter the code you were given to join or view your quiz.</p>
            <form id="joinForm">
                <input type="text" id="joinCodeInput" maxlength="6" autocomplete="off" autocapitalize="characters"
                    placeholder="ABC123" title="The 6-character code shown on the host screen or given to you">
                <button type="submit" class="btn-join" id="btnJoin" title="Join using this code">Join</button>
            </form>
            <p id="joinError"></p>
        </div>
    </div>

    <script src="toast.js"></script>
    <script src="theme.js"></script>
    <script src="utils.js"></script>
    <script src="help.js"></script>
    <script>
        // If the browser restores this page from its back/forward cache (e.g. the
        // player hits Back after finishing a quiz), the page's JS does not re-run —
        // whatever code was last typed, or a stale error, would stay on screen and
        // could carry into the next quiz. Force a real reload so this page is
        // always a clean slate.
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) window.location.reload();
        });

        const input = document.getElementById('joinCodeInput');
        const errorBox = document.getElementById('joinError');
        const btn = document.getElementById('btnJoin');

        input.addEventListener('input', () => {
            input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
        });

        async function submitCode(code) {
            errorBox.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Joining...';
            try {
                const res = await fetch('/api/live-quiz/join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Code not found — check it and try again.');

                const target = data.kind === 'team'
                    ? `/quiz-play.html?teamCode=${encodeURIComponent(data.code)}`
                    : `/quiz-play.html?code=${encodeURIComponent(data.code)}`;
                window.location.href = target;
            } catch (e) {
                errorBox.textContent = e.message;
                errorBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Join';
            }
        }

        document.getElementById('joinForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const code = input.value.trim();
            if (code.length < 4) {
                errorBox.textContent = 'Enter the full code.';
                errorBox.style.display = 'block';
                return;
            }
            submitCode(code);
        });

        (function init() {
            const params = new URLSearchParams(window.location.search);
            const prefill = params.get('code');
            if (prefill) {
                input.value = prefill.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
                submitCode(input.value);
            } else {
                input.focus();
            }
        })();
    </script>
</body>

</html>
