<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="resources/favicon.ico">
    <title id="pageTitle">Survey Tracking - OpReady</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="/sidebar.css">
    <style>
        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background: var(--bg-card);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
        }

        .filter-group input,
        .filter-group select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-main);
            height: 36px;
            box-sizing: border-box;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }

        .status-submitted {
            background: rgba(40, 167, 69, 0.15);
            color: #28a745;
            border: 1px solid rgba(40, 167, 69, 0.3);
        }

        .code-snippet {
            background: var(--bg-body);
            padding: 4px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div id="demoBanner" class="demo-banner" style="display:none;">DEMO VERSION</div>

    <a href="live-surveys.html" class="back-btn back-dashboard-btn" title="Back to Live Surveys">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>

    <div class="container">
        <h1 id="pageHeader" class="text-center" style="margin-top:0;">Tracking: Loading...</h1>

<div class="filter-bar">
            <div class="filter-group" style="flex: 1; min-width: 200px;">
                <label>Member Name</label>
                <input type="text" id="filterName" placeholder="Search members...">
            </div>
            <div class="filter-group">
                <label>Completion Status</label>
                <select id="filterStatus" style="width: 150px;">
                    <option value="all">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="submitted">Submitted</option>
                </select>
            </div>
            
            <div class="filter-group" style="flex-direction: row; gap: 10px; align-items: flex-end;">
                <button onclick="applyFilters()" class="btn-sm btn-primary" style="height: 36px; padding: 0 15px;">Apply</button>
                <button onclick="resetFilters()" class="btn-sm btn-secondary" style="height: 36px; padding: 0 15px;">Reset</button>
            </div>

            <div style="flex-grow: 1;"></div>

            <div class="filter-group" style="flex-direction: row; align-items: flex-end;">
                <button onclick="remindAllPending()" class="btn-sm" style="background: #ffc107; color: #000; border: none; display: flex; align-items: center; gap: 5px; height: 36px; padding: 0 15px;" title="Send Reminder to All Pending">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    Remind All Pending
                </button>
            </div>
        </div>
        <div style="overflow-x:auto;">
            <table class="data-table" style="width: 100%;">
                <thead>
                    <tr>
                        <th onclick="setSort('member_name')" style="cursor:pointer;">Member <span
                                id="sort_member_name"></span></th>
                        <th onclick="setSort('status')" style="cursor:pointer; width: 120px;">Status <span
                                id="sort_status"></span></th>
                        <th onclick="setSort('completed_at')" style="cursor:pointer; width: 160px;">Completed Date <span
                                id="sort_completed_at"></span></th>
                        <th style="width: 200px; text-align:right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="4" style="text-align:center;">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <button onclick="scrollToTop()" id="scrollTopBtn" title="Go to top">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
    </button>

    <script src="utils.js"></script>
    <script src="toast.js"></script>
    <script src="theme.js"></script>
    <script src="help.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="js/surveys-tracking.js"></script>
</body>

</html>
