
services:

  app:
    container_name: opready
    build: .
    # Override the Dockerfile's USER node for local bind-mount deployments.
    # The host directory is mounted at /app, so the container needs root to write
    # fenz.db, sessions.db, and .wwebjs_auth. Cloud Run deployments (no bind mount)
    # use the image's USER node automatically.
    user: "0"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      # Custom branding assets — override UI_RESOURCES_PATH in .env to use a different host path
      - ${UI_RESOURCES_PATH:-./public/resources}:/app/public/resources
      # Knowledge Base document storage — persists uploaded PDFs across restarts and redeployments.
      # Default: ./storage/knowledgebase (inside the project directory, already gitignored).
      # Set KB_STORAGE_HOST_PATH in .env to redirect to an external disk, NAS mount, or named volume.
      - ${KB_STORAGE_HOST_PATH:-./storage/knowledgebase}:/app/storage/knowledgebase
      # Scheduled backup output — persists backup files created by the built-in scheduler.
      # Default: ./backups (inside the project directory, already gitignored).
      # Set BACKUP_HOST_PATH in .env to redirect to an external disk or NAS mount.
      # Configure /app/backups as the save location in the Backup & Restore UI.
      - ${BACKUP_HOST_PATH:-./backups}:/backups
    env_file:         
      - .env  
    networks:
      - opready 
    command: node server.js
    restart: unless-stopped
networks:
  opready:
