
services:

  app:
    container_name: opready
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      # CHANGED: Allow overriding resources via .env, default to standard folder
      - ${UI_RESOURCES_PATH:-./public/resources}:/app/public/resources
    env_file:         
      - .env  
   
# CHANGED: Use nodemon with legacy watch for better file change detection to avoid crashing SQLlite on journal refreshing- 
# USE it in PRODUCTION         
    command: npx nodemon -L server.js
# use this in development   
#    command: npx nodemon  server.js
    restart: unless-stopped
networks:
  default:
    driver: bridge
  opready:
    driver: bridge